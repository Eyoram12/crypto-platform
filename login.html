<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #151c32;
            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab3c5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #35405f;
            border-radius: 8px;
            background: #0f1629;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            line-height: 2;
        }

        a {
            color: #6ea0ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your CryptoVault account
        </p>

        <form action="dashboard.html" method="get">

            <label for="username">
                Email or Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter email or username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="links">

            Don't have an account?
            <a href="register.html">Create Account</a>

            <br>

            <a href="index.html">← Back to Home</a>

        </div>

    </div>

</body>

</html>
