<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body.dark {
            background: linear-gradient(135deg, #0f172a, #111827);
            color: #f9fafb;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
        }

        .theme-btn {
            border: none;
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        body.dark .theme-btn {
            background: #1f2937;
            color: white;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        body.dark .card {
            background: #1f2937;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        body.dark .subtitle {
            color: #d1d5db;
        }

        .demo-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 14px;
            line-height: 1.6;
        }

        body.dark .demo-box {
            background: #172554;
            border-color: #1d4ed8;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 18px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
            color: #111827;
        }

        body.dark input[type="text"],
        body.dark input[type="password"] {
            background: #111827;
            border-color: #374151;
            color: white;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 9px;
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #2563eb;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        body.dark .register {
            color: #d1d5db;
        }

        .register a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .security {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 13px;
            text-align: center;
            color: #4b5563;
            line-height: 1.5;
        }

        body.dark .security {
            background: #111827;
            color: #d1d5db;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 24px;
            }

            .options {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">

            <div class="logo">
                🔐 CryptoVault
            </div>

            <button
                class="theme-btn"
                id="themeButton"
                type="button"
                onclick="toggleTheme()">
                🌙
            </button>

        </div>


        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CryptoVault account
            </p>


            <div class="demo-box">

                <strong>Demo Account</strong><br>

                Username:
                <strong>demo</strong><br>

                Password:
                <strong>123456</strong>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="show-btn"
                            id="showPasswordButton"
                            onclick="togglePassword()">
                            Show
                        </button>

                    </div>

                </div>


                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember">

                        Remember me

                    </label>


                    <span
                        class="forgot"
                        onclick="forgotPassword()">

                        Forgot password?

                    </span>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton">

                    Login

                </button>


                <div
                    id="message"
                    class="message">
                </div>

            </form>


            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="security">

                🛡️ <strong>Demo Environment</strong><br>

                No real cryptocurrency, money,
                bank transfer, or payment processing
                is connected to this website.

            </div>


            <div class="back">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script>

        /* ==============================
           THEME
        ============================== */

        function loadTheme() {

            const theme =
                localStorage.getItem("cryptoVaultTheme");

            const button =
                document.getElementById("themeButton");

            if (theme === "dark") {

                document.body.classList.add("dark");

                button.textContent = "☀️";

            } else {

                document.body.classList.remove("dark");

                button.textContent = "🌙";
            }
        }


        function toggleTheme() {

            document.body.classList.toggle("dark");

            const button =
                document.getElementById("themeButton");

            if (document.body.classList.contains("dark")) {

                localStorage.setItem(
                    "cryptoVaultTheme",
                    "dark"
                );

                button.textContent = "☀️";

            } else {

                localStorage.setItem(
                    "cryptoVaultTheme",
                    "light"
                );

                button.textContent = "🌙";
            }
        }


        /* ==============================
           SHOW / HIDE PASSWORD
        ============================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.getElementById(
                    "showPasswordButton"
                );

            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            } else {

                password.type = "password";

                button.textContent = "Show";
            }
        }


        /* ==============================
           LOGIN
        ============================== */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const remember =
                    document
                        .getElementById("remember")
                        .checked;

                const message =
                    document
                        .getElementById("message");

                const loginButton =
                    document
                        .getElementById("loginButton");


                /* Demo credentials */

                const correctUsername = "demo";

                const correctPassword = "123456";


                /* Check credentials */

                if (
                    username !== correctUsername &&
                    username !== "demo@cryptovault.com"
                ) {

                    message.className =
                        "message error";

                    message.textContent =
                        "❌ Incorrect username.";

                    return;
                }


                if (password !== correctPassword) {

                    message.className =
                        "message error";

                    message.textContent =
                        "❌ Incorrect password.";

                    return;
                }


                /* Login successful */

                localStorage.setItem(
                    "cryptoVaultLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "cryptoVaultUsername",
                    "demo"
                );


                if (remember) {

                    localStorage.setItem(
                        "cryptoVaultRemember",
                        "true"
                    );

                } else {

                    localStorage.removeItem(
                        "cryptoVaultRemember"
                    );
                }


                message.className =
                    "message success";

                message.textContent =
                    "✅ Login successful. Opening Dashboard...";


                loginButton.disabled = true;

                loginButton.textContent =
                    "Opening Dashboard...";


                /*
                   Direct GitHub Pages redirect
                */

                setTimeout(function() {

                    window.location.href =
                        window.location.origin +
                        window.location.pathname
                            .replace(
                                /\/[^\/]*$/,
                                "/dashboard.html"
                            );

                }, 700);

            });


        /* ==============================
           FORGOT PASSWORD
        ============================== */

        function forgotPassword() {

            alert(
                "Demo password:\n\n" +
                "123456\n\n" +
                "Password recovery is simulated."
            );
        }


        /* ==============================
           LOAD THEME
        ============================== */

        loadTheme();

    </script>

</body>

</html>
