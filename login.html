<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .page {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #38bdf8;
        }

        .card {
            background: #0d1b2d;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #081525;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #38bdf8;
            color: #03111f;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #7dd3fc;
        }

        .register-text {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-top: 22px;
        }

        .register-text a {
            color: #38bdf8;
            font-weight: 700;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }

        .home-link:hover {
            color: #38bdf8;
        }

        .demo-notice {
            margin-top: 22px;
            padding: 13px;
            background: #082f49;
            border: 1px solid #164e63;
            border-radius: 9px;
            color: #bae6fd;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="logo">
        Crypto<span>Vault</span>
    </div>

    <div class="card">

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to access your CryptoVault demonstration dashboard.
        </p>

        <form action="dashboard.html" method="get">

            <div class="form-group">
                <label for="username">Username or Email</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-text">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

        <div class="demo-notice">
            <strong>Demo platform:</strong>
            This login form is for demonstration purposes.
            It does not authenticate against a real database or
            store passwords.
        </div>

    </div>

</div>

</body>
</html>
