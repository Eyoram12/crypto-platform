<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CryptoVault | Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #172033;
}

.container {
    width: 92%;
    max-width: 430px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
    color: #111827;
}

.login-card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 28px;
    font-size: 14px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

.input-group {
    margin-bottom: 18px;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 75px;
}

.show-password {
    position: absolute;
    right: 10px;
    top: 9px;
    padding: 7px 9px;
    border: none;
    background: transparent;
    color: #2563eb;
    cursor: pointer;
    font-weight: bold;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    font-size: 13px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
}

.remember input {
    width: auto;
}

.forgot {
    color: #2563eb;
    text-decoration: none;
}

.forgot:hover {
    text-decoration: underline;
}

.login-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    opacity: .9;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    background: #ecfdf3;
    color: #166534;
    text-align: center;
    font-size: 13px;
}

.register {
    text-align: center;
    margin-top: 24px;
    color: #667085;
    font-size: 14px;
}

.register a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.security {
    margin-top: 22px;
    padding: 14px;
    background: #f8fafc;
    border-radius: 9px;
    text-align: center;
    color: #667085;
    font-size: 12px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #667085;
    text-decoration: none;
    font-size: 13px;
}

.back:hover {
    color: #2563eb;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🔐 CryptoVault
    </div>

    <div class="login-card">

        <h1>Welcome Back</h1>

        <div class="subtitle">
            Sign in to your CryptoVault account
        </div>


        <form onsubmit="login(event)">

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword(event)"
                >
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>


            <div
                id="message"
                class="message"
            >
                Login successful. Opening your account...
            </div>

        </form>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <div class="security">

            🔒 Your account security is important to us.

        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");

    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }

}


function login(event) {

    event.preventDefault();

    const message =
        document.getElementById("message");

    message.style.display = "block";

    setTimeout(function() {

        window.location.href = "dashboard.html";

    }, 1200);

}


function forgotPassword(event) {

    event.preventDefault();

    alert(
        "Password recovery is currently available as a website interface."
    );

}

</script>

</body>
</html>
