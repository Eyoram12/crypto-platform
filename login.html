<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body.dark {
            background: linear-gradient(135deg, #0f172a, #111827);
            color: #f9fafb;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
        }

        .theme-btn {
            border: none;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        body.dark .theme-btn {
            background: #1f2937;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        body.dark .card {
            background: #1f2937;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        body.dark .subtitle {
            color: #d1d5db;
        }

        .demo-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 14px;
        }

        body.dark .demo-box {
            background: #172554;
            border-color: #1d4ed8;
        }

        .demo-box strong {
            color: #2563eb;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
            color: #111827;
        }

        body.dark input {
            background: #111827;
            border-color: #374151;
            color: white;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-input {
            padding-right: 80px;
        }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 9px;
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-weight: bold;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #2563eb;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        body.dark .register {
            color: #d1d5db;
        }

        .register a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .security {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 13px;
            text-align: center;
            color: #4b5563;
        }

        body.dark .security {
            background: #111827;
            color: #d1d5db;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">
            <div class="logo">🔐 CryptoVault</div>

            <button class="theme-btn" onclick="toggleTheme()" id="themeButton">
                🌙
            </button>
        </div>

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CryptoVault demo account
            </p>

            <div class="demo-box">
                <strong>Demo Login</strong><br><br>
                Username: <strong>demo</strong><br>
                Password: <strong>123456</strong>
            </div>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword()"
                        id="showPasswordButton">
                        Show
                    </button>

                </div>
