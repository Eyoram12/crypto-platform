<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoVault P2P</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f8fc;
  color:#172033;
}

header{
  background:#0b1f3a;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:700;
}

.logo span{
  color:#155eef;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
}

.container{
  width:92%;
  max-width:1200px;
  margin:30px auto;
}

.hero{
  background:#0b1f3a;
  color:white;
  border-radius:18px;
  padding:30px;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#d0d5dd;
}

.market-box,
.quick{
  background:white;
  border:1px solid #e4e7ec;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.market-tab{
  flex:1;
  border:1px solid #d0d5dd;
  background:white;
  padding:13px;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.market-tab.active{
  background:#155eef;
  color:white;
  border-color:#155eef;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:7px;
}

select,
input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  font-size:15px;
  background:white;
}

select:focus,
input:focus{
  outline:none;
  border-color:#155eef;
  box-shadow:0 0 0 3px rgba(21,94,239,.08);
}

.market-title{
  font-size:22px;
  font-weight:700;
  margin:10px 0 20px;
}

.offers{
  display:grid;
  gap:15px;
}

.offer{
  border:1px solid #e4e7ec;
  border-radius:14px;
  padding:20px;
  background:white;
}

.offer-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.trader{
  font-weight:700;
  font-size:17px;
}

.verified{
  color:#15803d;
  font-size:13px;
  margin-top:5px;
}

.price{
  font-size:22px;
  font-weight:700;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0;
}

.info{
  background:#f6f8fc;
  padding:12px;
  border-radius:9px;
  overflow-wrap:anywhere;
}

.info small{
  display:block;
  color:#667085;
  margin-bottom:5px;
}

.payment{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}

.payment span{
  background:#eef4ff;
  color:#155eef;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
}

.action{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  color:white;
  background:#155eef;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.action.sell{
  background:#dc2626;
}

.action.secondary{
  background:#475467;
}

.action.success-button{
  background:#15803d;
}

.action.warning-button{
  background:#d97706;
}

.action.danger-button{
  background:#dc2626;
}

.action:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#667085;
  border:1px dashed #d0d5dd;
  border-radius:12px;
}

.quick{
  margin-top:25px;
}

.quick h2{
  margin-bottom:18px;
}

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.calc{
  margin-top:18px;
  background:#f6f8fc;
  padding:15px;
  border-radius:10px;
}

.calc-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  gap:15px;
}

.calc-row strong{
  font-weight:700;
  text-align:right;
  overflow-wrap:anywhere;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  display:none;
}

.status.success{
  display:block;
  background:#ecfdf3;
  color:#15803d;
}

.status.error{
  display:block;
  background:#fef2f2;
  color:#dc2626;
}

.status.info{
  display:block;
  background:#eef4ff;
  color:#155eef;
}

.status.warning{
  display:block;
  background:#fffbeb;
  color:#92400e;
}

.trade-button{
  margin-top:15px;
}

.trade-status{
  display:inline-block;
  padding:6px 10px;
  border-radius:7px;
  font-size:13px;
  font-weight:700;
  text-transform:capitalize;
  background:#fff7ed;
  color:#c2410c;
}

.payment-box{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:#f6f8fc;
}

.payment-box h3{
  margin-bottom:10px;
}

.payment-method-select{
  margin-top:10px;
}

.payment-reference{
  margin-top:15px;
}

.expiry{
  color:#667085;
  font-size:13px;
  margin-top:10px;
}

.warning-box{
  margin-top:15px;
  padding:13px;
  border-radius:9px;
  background:#fffbeb;
  color:#92400e;
  font-size:13px;
  line-height:1.5;
}

.success-box{
  margin-top:15px;
  padding:13px;
  border-radius:9px;
  background:#ecfdf3;
  color:#166534;
  font-size:13px;
  line-height:1.5;
}

.info-box{
  margin-top:15px;
  padding:13px;
  border-radius:9px;
  background:#eef4ff;
  color:#155eef;
  font-size:13px;
  line-height:1.5;
}

.payment-detail{
  margin-top:10px;
  padding:13px;
  background:white;
  border:1px solid #e4e7ec;
  border-radius:9px;
}

.payment-detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #f0f2f5;
}

.payment-detail-row:last-child{
  border-bottom:0;
}

.payment-detail-row span{
  color:#667085;
}

.payment-detail-row strong{
  text-align:right;
  overflow-wrap:anywhere;
}

.secure-note{
  margin-top:12px;
  font-size:13px;
  color:#475467;
  line-height:1.5;
}

.status-flow{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:#f6f8fc;
}

.status-flow-title{
  font-weight:700;
  margin-bottom:10px;
}

.status-steps{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.status-step{
  padding:7px 10px;
  border-radius:7px;
  background:#e4e7ec;
  color:#475467;
  font-size:13px;
  font-weight:600;
}

.status-step.current{
  background:#fff7ed;
  color:#c2410c;
}

.status-step.done{
  background:#ecfdf3;
  color:#15803d;
}

.release-box{
  margin-top:15px;
  padding:15px;
  border:1px solid #bbf7d0;
  border-radius:10px;
  background:#f0fdf4;
}

.release-box strong{
  color:#166534;
}

footer{
  margin-top:40px;
  background:#0b1f3a;
  color:#d0d5dd;
  text-align:center;
  padding:25px;
}

@media(max-width:700px){

  header{
    padding:15px;
  }

  nav{
    display:none;
  }

  .container{
    width:94%;
    margin:20px auto;
  }

  .hero h1{
    font-size:26px;
  }

  .filters,
  .quick-grid{
    grid-template-columns:1fr;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .offer-top{
    flex-direction:column;
  }

  .payment-detail-row{
    flex-direction:column;
    gap:4px;
  }

  .payment-detail-row strong{
    text-align:left;
  }
}
</style>

</head>

<body>

<header>

<div class="logo">
Crypto<span>Vault</span>
</div>

<nav>
<a href="index.html">Home</a>
<a href="p2p.html">P2P</a>
</nav>

</header>

<div class="container">

<section class="hero">

<h1 id="heroTitle">
P2P Marketplace
</h1>

<p id="heroText">
Buy and sell cryptocurrency directly with verified traders.
</p>

</section>

<section class="market-box">

<div class="tabs">

<button
type="button"
id="buyTab"
class="market-tab active"
onclick="setMarket('buy')">
Buy </button>

<button
type="button"
id="sellTab"
class="market-tab"
onclick="setMarket('sell')">
Sell </button>

</div>

<div class="filters">

<div>

<label for="assetSelect">
Asset
</label>

<select
id="assetSelect"
onchange="marketChanged()">

<option value="USDT">USDT</option>
<option value="BTC">BTC</option>
<option value="ETH">ETH</option>

</select>

</div>

<div>

<label for="fiatSelect">
Fiat Currency
</label>

<select
id="fiatSelect"
onchange="marketChanged()">

<option value="ETB">ETB</option>
<option value="USD">USD</option>

</select>

</div>

</div>

</section>

<section class="market-box">

<div
id="marketTitle"
class="market-title">
Buy USDT with ETB
</div>

<div
id="offers"
class="offers">

<div class="empty">
Loading offers...
</div>

</div>

</section>

<section class="quick">

<h2>
Quick Trade
</h2>

<div class="quick-grid">

<div>

<label id="amountLabel">
Amount (ETB)
</label>

<input
id="quickAmount"
type="number"
min="0"
step="any"
placeholder="Enter amount"
oninput="calculateTrade()">

</div>

<div>

<label>
Selected Trader
</label>

<input
id="selectedTrader"
type="text"
value="No offer selected"
readonly>

</div>

</div>

<div class="payment-box">

<h3>
Payment Method
</h3>

<label for="paymentMethodSelect">
Choose payment method
</label>

<select
id="paymentMethodSelect"
class="payment-method-select"
onchange="paymentMethodChanged()">

<option value="">
Select an offer first
</option>

</select>

</div>

<div class="calc">

<div class="calc-row">
<span>Rate</span>
<strong id="calcRate">-</strong>
</div>

<div class="calc-row">
<span>Fee</span>
<strong id="calcFee">-</strong>
</div>

<div class="calc-row">
<span>Receive</span>
<strong id="calcReceive">-</strong>
</div>

</div>

<div id="status" class="status"></div>

<button
type="button"
id="createTradeBtn"
class="action trade-button"
onclick="createTrade()">
Create Trade </button>

</section>

<section class="quick">

<h2>
My Trade
</h2>

<div id="myTrade">

<div class="empty">
No trade created yet.
</div>

</div>

</section>

</div>

<footer>
CryptoVault P2P Marketplace
</footer>

<script>

const SUPABASE_URL =
"https://zihxnxnviknexlqjjdot.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_A5KO4RzERX6ZOTR5vPS4kQ_GkmbxNlc";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let marketSide = "buy";
let selectedOffer = null;
let selectedTrade = null;
let selectedPaymentMethod = null;
let currentUserId = null;


/* =========================
   AUTH
========================= */

async function getCurrentUser(){

try{

const result =
await supabaseClient.auth.getSession();

if(result.error){

console.error(result.error);
return null;

}

const session =
result.data.session;

if(!session){

currentUserId = null;
return null;

}

currentUserId =
session.user.id;

return session.user;

}catch(error){

console.error(error);

return null;

}

}


/* =========================
   MARKET
========================= */

function setMarket(side){

marketSide =
side === "sell"
? "sell"
: "buy";

selectedOffer = null;
selectedPaymentMethod = null;

clearTradeSelection();

updateMarketTabs();
updateMarketTitle();
refreshMarket();

}


function marketChanged(){

selectedOffer = null;
selectedPaymentMethod = null;

clearTradeSelection();

updateMarketTitle();
refreshMarket();

}


function clearTradeSelection(){

document.getElementById("selectedTrader").value =
"No offer selected";

document.getElementById("quickAmount").value =
"";

document.getElementById("paymentMethodSelect").innerHTML =
`<option value="">Select an offer first</option>`;

document.getElementById("paymentMethodSelect").disabled =
false;

calculateTrade();

}


/* =========================
   MARKET TABS
========================= */

function updateMarketTabs(){

document.getElementById("buyTab")
.classList.toggle(
"active",
marketSide === "buy"
);

document.getElementById("sellTab")
.classList.toggle(
"active",
marketSide === "sell"
);

}


/* =========================
   TITLES
========================= */

function updateMarketTitle(){

const asset =
document.getElementById("assetSelect").value;

const fiat =
document.getElementById("fiatSelect").value;

if(marketSide === "buy"){

document.getElementById("marketTitle").textContent =
`Buy ${asset} with ${fiat}`;

document.getElementById("heroTitle").textContent =
`Buy ${asset}`;

document.getElementById("heroText").textContent =
`Buy ${asset} from P2P traders.`;

document.getElementById("amountLabel").textContent =
`Amount (${fiat})`;

}else{

document.getElementById("marketTitle").textContent =
`Sell ${asset} for ${fiat}`;

document.getElementById("heroTitle").textContent =
`Sell ${asset}`;

document.getElementById("heroText").textContent =
`Sell ${asset} to P2P traders.`;

document.getElementById("amountLabel").textContent =
`Amount (${asset})`;

}

}


/* =========================
   LOAD OFFERS
========================= */

async function loadOffers(){

const asset =
document.getElementById("assetSelect").value;

const fiat =
document.getElementById("fiatSelect").value;

const result =
await supabaseClient
.from("p2p_offers")
.select("*")
.eq("status","active")
.eq("side",marketSide)
.eq("asset",asset)
.eq("fiat",fiat)
.order(
"price",
{
ascending:
marketSide === "buy"
}
);

if(result.error){

console.error(result.error);

showStatus(
"Could not load P2P offers.",
"error"
);

return [];

}

return result.data || [];

}


/* =========================
   PAYMENT METHODS
========================= */

async function loadPaymentMethods(offers){

if(!offers || offers.length === 0){
return offers || [];
}

const traderIds = [
...new Set(
offers
.map(offer => offer.trader_id)
.filter(Boolean)
)
];

if(traderIds.length === 0){
return offers;
}

try{

const result =
await supabaseClient
.from("trader_payment_methods")
.select(`
id,
trader_id,
payment_method_id,
account_name,
account_identifier,
status,
created_at,
payment_methods (
id,
name,
enabled
)
`)
.in("trader_id",traderIds)
.eq("status","active");

if(result.error){

console.warn(
"Payment method warning:",
result.error.message
);

return offers;

}

return offers.map(
offer => {

const methods =
(result.data || [])
.filter(
row =>
String(row.trader_id) ===
String(offer.trader_id)
)
.map(
row => {

const method =
row.payment_methods || {};

return {

id: row.payment_method_id,

name:
method.name ||
"Payment Method",

enabled:
method.enabled !== false,

account_name:
row.account_name || "",

account_identifier:
row.account_identifier || "",

payment_row_id:
row.id

};

}
)
.filter(
method =>
method.enabled !== false
);

return {
...offer,
methods
};

}
);

}catch(error){

console.warn(error);

return offers;

}

}


/* =========================
   TRADER INFORMATION
========================= */

async function enrichOffers(offers){

if(!offers || offers.length === 0){
return [];
}

const traderIds = [
...new Set(
offers
.map(offer => offer.trader_id)
.filter(Boolean)
)
];

let profiles = [];
let stats = [];

try{

const result =
await supabaseClient
.from("profiles")
.select("*")
.in("id",traderIds);

if(!result.error){
profiles = result.data || [];
}

}catch(error){

console.warn(error);

}

try{

const result =
await supabaseClient
.from("trader_stats")
.select("*")
.in("user_id",traderIds);

if(!result.error){
stats = result.data || [];
}

}catch(error){

console.warn(error);

}

return offers.map(
offer => {

const profile =
profiles.find(
profile =>
String(profile.id) ===
String(offer.trader_id)
);

const traderStats =
stats.find(
stat =>
String(stat.user_id) ===
String(offer.trader_id)
);

return {

...offer,

profile,

traderStats

};

}
);

}


/* =========================
   REFRESH MARKET
========================= */

async function refreshMarket(){

updateMarketTitle();

const container =
document.getElementById("offers");

container.innerHTML =
`<div class="empty">
Loading ${escapeHTML(marketSide)} offers...
</div>`;

try{

const offers =
await loadOffers();

let enriched =
await enrichOffers(offers);

enriched =
await loadPaymentMethods(enriched);

renderOffers(enriched);

}catch(error){

console.error(error);

container.innerHTML =
`<div class="empty">
Could not load offers.
</div>`;

showStatus(
"Something went wrong while loading the marketplace.",
"error"
);

}

}


/* =========================
   RENDER OFFERS
========================= */

function renderOffers(offers){

const container =
document.getElementById("offers");

if(!offers || offers.length === 0){

container.innerHTML =
`<div class="empty">
No active ${escapeHTML(marketSide)} offers are available.
</div>`;

return;

}

const asset =
document.getElementById("assetSelect").value;

const fiat =
document.getElementById("fiatSelect").value;

container.innerHTML =
offers.map(
offer => {

const profile =
offer.profile || {};

const stats =
offer.traderStats || {};

const traderName =
profile.full_name ||
profile.username ||
profile.name ||
"Trader";

const rating =
stats.rating ??
stats.average_rating ??
"New";

const completed =
stats.completed_trades ??
stats.total_trades ??
0;

const available =
offer.available_amount ??
offer.amount ??
offer.crypto_amount ??
offer.quantity ??
0;

const minimum =
offer.minimum ??
offer.min_amount ??
offer.minimum_amount ??
0;

const maximum =
offer.maximum ??
offer.max_amount ??
offer.maximum_amount ??
0;

const methods =
offer.methods || [];

let paymentHTML =
methods.length > 0
?
methods.map(
method =>
`<span>${escapeHTML(method.name || "Payment")}</span>`
).join("")
:
`<span>No payment method</span>`;

const buttonText =
marketSide === "buy"
? `Buy ${asset}`
: `Sell ${asset}`;

const buttonClass =
marketSide === "sell"
? "action sell"
: "action";

return `

<div class="offer">

<div class="offer-top">

<div>

<div class="trader">
${escapeHTML(traderName)}
</div>

<div class="verified">
✓ Verified Trader
</div>

</div>

<div class="price">
${formatNumber(offer.price)}
${escapeHTML(fiat)}
</div>

</div>

<div class="info-grid">

<div class="info">
<small>Available</small>
${formatNumber(available)}
${escapeHTML(asset)}
</div>

<div class="info">
<small>Minimum</small>
${formatNumber(minimum)}
${escapeHTML(fiat)}
</div>

<div class="info">
<small>Completed trades</small>
${escapeHTML(String(completed))}
</div>

</div>

<div class="payment">
${paymentHTML}
</div>

<div style="font-size:13px;color:#667085;margin-bottom:12px;">
Rating:
<strong>${escapeHTML(String(rating))}</strong>
</div>

${
maximum
?
`<div style="font-size:13px;color:#667085;margin-bottom:12px;">
Maximum:
<strong>
${formatNumber(maximum)}
${escapeHTML(fiat)}
</strong>
</div>`
: ""
}

<button
type="button"
class="${buttonClass}"
data-offer-id="${escapeHTML(String(offer.id))}">
${buttonText}
</button>

</div>

`;

}
).join("");

container
.querySelectorAll("[data-offer-id]")
.forEach(
button => {

button.addEventListener(
"click",
function(){

selectOffer(
this.dataset.offerId,
offers
);

}
);

}
);

}


/* =========================
   SELECT OFFER
========================= */

function selectOffer(offerId,offers){

const offer =
offers.find(
item =>
String(item.id) ===
String(offerId)
);

if(!offer){

showStatus(
"Offer could not be found.",
"error"
);

return;

}

selectedOffer = offer;
selectedPaymentMethod = null;

const profile =
offer.profile || {};

const traderName =
profile.full_name ||
profile.username ||
profile.name ||
"Trader";

document.getElementById(
"selectedTrader"
).value =
traderName;

loadPaymentMethodSelector(offer);

calculateTrade();

document.querySelector(".quick")
.scrollIntoView({
behavior:"smooth"
});

if(offer.methods && offer.methods.length > 0){

showStatus(
"Offer selected. Choose a payment method and enter your amount.",
"success"
);

}else{

showStatus(
"This trader has no active payment method.",
"warning"
);

}

}


/* =========================
   PAYMENT SELECTOR
========================= */

function loadPaymentMethodSelector(offer){

const select =
document.getElementById("paymentMethodSelect");

select.innerHTML =
`<option value="">Select payment method</option>`;

const methods =
offer.methods || [];

if(methods.length === 0){

select.innerHTML =
`<option value="">No payment method available</option>`;

function calculateTrade(){

const amount =
parseFloat(
document.getElementById("quickAmount").value
) || 0;

const rate =
selectedOffer
? Number(selectedOffer.price)
: 0;

const asset =
document.getElementById("assetSelect").value;

const fiat =
document.getElementById("fiatSelect").value;

if(
!selectedOffer ||
!rate ||
amount <= 0
){

document.getElementById("calcRate").textContent = "-";
document.getElementById("calcFee").textContent = "-";
document.getElementById("calcReceive").textContent = "-";

return;

}

const feeRate = 0.005;

if(marketSide === "buy"){

const crypto =
amount / rate;

const fee =
crypto * feeRate;

const receive =
crypto - fee;

document.getElementById("calcRate").textContent =
`${formatNumber(rate)} ${fiat}`;

document.getElementById("calcFee").textContent =
`${fee.toFixed(6)} ${asset}`;

document.getElementById("calcReceive").textContent =
`${receive.toFixed(6)} ${asset}`;

}else{

const gross =
amount * rate;

const fee =
gross * feeRate;

const receive =
gross - fee;

document.getElementById("calcRate").textContent =
`${formatNumber(rate)} ${fiat}`;

document.getElementById("calcFee").textContent =
`${fee.toFixed(2)} ${fiat}`;

document.getElementById("calcReceive").textContent =
`${receive.toFixed(2)} ${fiat}`;

}

}

/* =========================
   STATUS ORDER
========================= */

const STATUS_ORDER = [

"awaiting_payment",

"payment_sent",

"payment_confirmed",

"crypto_released",

"completed"

];


function statusLabel(status){

const labels = {

awaiting_payment:
"Awaiting Payment",

payment_sent:
"Payment Sent",

payment_confirmed:
"Payment Confirmed",

crypto_released:
"Crypto Released",

completed:
"Completed",

disputed:
"Disputed",

cancelled:
"Cancelled",

expired:
"Expired",

pending:
"Pending"

};

return labels[status] || status;

}


function statusIndex(status){

return STATUS_ORDER.indexOf(status);

}


/* =========================
   STATUS FLOW
========================= */

function renderStatusFlow(status){

const currentIndex =
statusIndex(status);

return STATUS_ORDER.map(
(step,index) => {

let className =
"status-step";

if(
currentIndex >= 0 &&
index < currentIndex
){

className += " done";

}

if(
step === status
){

className += " current";

}

return `

<div class="${className}">
${escapeHTML(statusLabel(step))}
</div>

`;

}
).join("");

}

async function submitPaymentReference(){

if(!selectedTrade){

showStatus(
"No active trade is selected.",
"error"
);

return;

}

if(
selectedTrade.status !==
"awaiting_payment"
){

showStatus(
"Payment reference cannot be changed at this stage.",
"warning"
);

return;

}

if(
!currentUserId ||
String(currentUserId) !==
String(selectedTrade.buyer_id)
){

showStatus(
"Only the buyer can save the payment reference.",
"error"
);

return;

}

const input =
document.getElementById(
"paymentReferenceInput"
);

if(!input){
return;
}

const reference =
input.value.trim();

if(!reference){

showStatus(
"Please enter the payment reference.",
"error"
);

return;

}

if(reference.length < 3){

showStatus(
"Payment reference is too short.",
"error"
);

return;

}

const result =
await supabaseClient
.from("p2p_trades")
.update({
payment_reference:
reference
})
.eq("id",selectedTrade.id)
.eq("buyer_id",currentUserId)
.eq("status","awaiting_payment")
.select()
.single();

if(result.error){

console.error(
"Payment reference error:",
result.error
);

showStatus(
"Payment reference could not be saved: " +
result.error.message,
"error"
);

return;

}

selectedTrade =
result.data;

renderMyTrade(
selectedTrade
);

showStatus(
"Payment reference saved.",
"success"
);

}

className = "success";
}

else if(type === "info"){
className = "info";
}

else if(type === "warning"){
className = "warning";
}

box.className =
"status " + className;

}


/* =========================
   FORMAT
========================= */

function formatNumber(value){

const number =
Number(value);

if(Number.isNaN(number)){
return "0";
}

return number.toLocaleString(
undefined,
{
maximumFractionDigits:8
}
);

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   URL
========================= */

function applyURL(){

const params =
new URLSearchParams(
window.location.search
);

const type =
params.get("type");

const asset =
params.get("asset");

if(
type &&
type.toLowerCase() ===
"sell"
){

marketSide =
"sell";

}else{

marketSide =
"buy";

}

if(asset){

const upper =
asset.toUpperCase();

if(
["USDT","BTC","ETH"].includes(
upper
)
){

document.getElementById(
"assetSelect"
).value =
upper;

}

}

updateMarketTabs();

}


/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
async function(){

applyURL();

await getCurrentUser();

updateMarketTitle();

await refreshMarket();

}
);

</script>
