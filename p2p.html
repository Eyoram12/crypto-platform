<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CryptoVault P2P Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #3b82f6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .hero {
            background: #0b1f3a;
            color: white;
            border-radius: 18px;
            padding: 32px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #d0d5dd;
            line-height: 1.6;
        }

        .card {
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tab {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #d0d5dd;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }

        .tab.active {
            background: #155eef;
            color: white;
            border-color: #155eef;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            background: white;
            font-size: 15px;
            font-family: inherit;
        }

        select:disabled,
        input:disabled,
        textarea:disabled {
            background: #f2f4f7;
            color: #667085;
            cursor: not-allowed;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #155eef;
            box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.08);
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .offers {
            display: grid;
            gap: 16px;
        }

        .offer {
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 20px;
            background: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .offer:hover {
            border-color: #155eef;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .offer.selected {
            border-color: #15803d;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.12);
            background: #fcfffd;
        }

        .offer-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 16px;
        }

        .trader-name {
            font-size: 18px;
            font-weight: 700;
        }

        .verified {
            color: #15803d;
            font-size: 13px;
            margin-top: 5px;
        }

        .selected-label {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 9px;
            border-radius: 6px;
            background: #ecfdf3;
            color: #15803d;
            font-size: 12px;
            font-weight: 700;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            text-align: right;
        }

        .price-label {
            color: #667085;
            font-size: 12px;
            margin-top: 4px;
            text-align: right;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .info-box {
            background: #f6f8fc;
            padding: 13px;
            border-radius: 9px;
        }

        .info-box small {
            display: block;
            color: #667085;
            margin-bottom: 5px;
        }

        .info-box strong {
            overflow-wrap: anywhere;
        }

        .offer-limit {
            font-size: 13px;
            color: #667085;
            margin-bottom: 12px;
        }

        .offer-reputation {
            font-size: 13px;
            color: #667085;
            margin-bottom: 10px;
        }

        .payments {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 14px 0;
        }

        .payment-tag {
            background: #eef4ff;
            color: #155eef;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
        }

        button {
            font-family: inherit;
        }

        .button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 9px;
            color: white;
            background: #155eef;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.92;
        }

        .button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .button.sell {
            background: #dc2626;
        }

        .button.success {
            background: #15803d;
        }

        .button.warning {
            background: #d97706;
        }

        .button.danger {
            background: #dc2626;
        }

        .button.secondary {
            background: #475467;
        }

        .button + .button {
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #667085;
            border: 1px dashed #d0d5dd;
            border-radius: 12px;
        }

        .trade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .calculation {
            background: #f6f8fc;
            padding: 16px;
            border-radius: 10px;
            margin-top: 18px;
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .calc-row span {
            color: #667085;
        }

        .calc-row strong {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .status-message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 9px;
            line-height: 1.5;
        }

        .status-message.success {
            display: block;
            background: #ecfdf3;
            color: #15803d;
        }

        .status-message.error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
        }

        .status-message.warning {
            display: block;
            background: #fffbeb;
            color: #92400e;
        }

        .status-message.info {
            display: block;
            background: #eef4ff;
            color: #155eef;
        }

        .trade-status {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 7px;
            background: #fff7ed;
            color: #c2410c;
            font-size: 13px;
            font-weight: 700;
        }

        .status-flow {
            background: #f6f8fc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .status-flow-title {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .status-steps {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-step {
            padding: 7px 10px;
            border-radius: 7px;
            background: #e4e7ec;
            color: #475467;
            font-size: 12px;
            font-weight: 600;
        }

        .status-step.done {
            background: #ecfdf3;
            color: #15803d;
        }

        .status-step.current {
            background: #fff7ed;
            color: #c2410c;
        }

        .payment-box {
            margin-top: 18px;
            background: #f6f8fc;
            padding: 17px;
            border-radius: 10px;
        }

        .payment-box h3 {
            margin-bottom: 10px;
        }

        .payment-detail {
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 9px;
            padding: 13px;
            margin-top: 12px;
        }

        .payment-detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .payment-detail-row:last-child {
            border-bottom: none;
        }

        .payment-detail-row span {
            color: #667085;
        }

        .payment-detail-row strong {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .trade-note {
            margin-top: 13px;
            padding: 13px;
            border-radius: 9px;
            background: #eef4ff;
            color: #155eef;
            font-size: 13px;
            line-height: 1.5;
        }

        .warning-note {
            margin-top: 13px;
            padding: 13px;
            border-radius: 9px;
            background: #fffbeb;
            color: #92400e;
            font-size: 13px;
            line-height: 1.5;
        }

        .success-note {
            margin-top: 13px;
            padding: 13px;
            border-radius: 9px;
            background: #ecfdf3;
            color: #166534;
            font-size: 13px;
            line-height: 1.5;
        }

        .expiry {
            margin-top: 12px;
            color: #667085;
            font-size: 13px;
        }

        /* =====================================================
           CONVERSATION
        ===================================================== */

        .conversation {
            margin-top: 22px;
            background: #f6f8fc;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e4e7ec;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .conversation-title {
            font-size: 18px;
            font-weight: 700;
        }

        .conversation-status {
            font-size: 12px;
            color: #667085;
            margin-top: 4px;
        }

        .messages {
            height: 320px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 10px;
            padding: 14px;
        }

        .message-row {
            display: flex;
            margin-bottom: 12px;
        }

        .message-row:last-child {
            margin-bottom: 0;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.theirs {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 78%;
            padding: 10px 13px;
            border-radius: 12px;
            line-height: 1.45;
            word-break: break-word;
        }

        .message-row.mine .message-bubble {
            background: #155eef;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.theirs .message-bubble {
            background: #eef2f6;
            color: #172033;
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .message-time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .message-input-area {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 10px;
            margin-top: 12px;
        }

        .message-input {
            min-height: 50px;
            max-height: 120px;
        }

        .send-message-button {
            height: 50px;
        }

        .chat-empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #667085;
            padding: 20px;
            line-height: 1.6;
        }

        .chat-loading {
            text-align: center;
            color: #667085;
            padding: 25px;
        }

        .chat-locked {
            margin-top: 10px;
            padding: 11px;
            border-radius: 8px;
            background: #fff7ed;
            color: #92400e;
            font-size: 12px;
            line-height: 1.5;
        }

        .chat-counter {
            text-align: right;
            margin-top: 5px;
            color: #667085;
            font-size: 11px;
        }

        footer {
            margin-top: 40px;
            background: #0b1f3a;
            color: #d0d5dd;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            nav {
                display: none;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .hero {
                padding: 25px;
            }

            .hero h1 {
                font-size: 26px;
            }

            .filters,
            .trade-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .offer-top {
                flex-direction: column;
            }

            .price,
            .price-label {
                text-align: left;
            }

            .payment-detail-row {
                flex-direction: column;
                gap: 4px;
            }

            .payment-detail-row strong {
                text-align: left;
            }

            .message-input-area {
                grid-template-columns: 1fr;
            }

            .send-message-button {
                height: auto;
            }

            .message-bubble {
                max-width: 90%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Crypto<span>Vault</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="p2p.html">P2P</a>
    </nav>

</header>


<div class="container">


    <section class="hero">

        <h1 id="heroTitle">
            P2P Marketplace
        </h1>

        <p id="heroText">
            Buy and sell cryptocurrency directly with P2P traders.
        </p>

    </section>


    <!-- MARKET FILTERS -->

    <section class="card">

        <div class="tabs">

            <button
                id="buyTab"
                class="tab active"
                type="button"
                onclick="setMarket('buy')"
            >
                Buy
            </button>

            <button
                id="sellTab"
                class="tab"
                type="button"
                onclick="setMarket('sell')"
            >
                Sell
            </button>

        </div>


        <div class="filters">

            <div>

                <label for="assetSelect">
                    Cryptocurrency
                </label>

                <select
                    id="assetSelect"
                    onchange="marketChanged()"
                >

                    <option value="USDT">USDT</option>
                    <option value="BTC">BTC</option>
                    <option value="ETH">ETH</option>

                </select>

            </div>


            <div>

                <label for="fiatSelect">
                    Fiat Currency
                </label>

                <select
                    id="fiatSelect"
                    onchange="marketChanged()"
                >

                    <option value="ETB">ETB</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>

                </select>

            </div>

        </div>

    </section>


    <!-- OFFERS -->

    <section class="card">

        <div id="marketTitle" class="section-title">
            Buy USDT with ETB
        </div>

        <div id="offers" class="offers">

            <div class="empty">
                Loading offers...
            </div>

        </div>

    </section>


    <!-- CREATE TRADE -->

    <section class="card">

        <div class="section-title">
            Create P2P Trade
        </div>


        <div class="trade-grid">

            <div>

                <label id="amountLabel">
                    Amount (ETB)
                </label>

                <input
                    id="quickAmount"
                    type="number"
                    min="0"
                    step="any"
                    placeholder="Enter amount"
                    oninput="calculateTrade()"
                >

            </div>


            <div>

                <label>
                    Selected Trader
                </label>

                <input
                    id="selectedTrader"
                    type="text"
                    value="No offer selected"
                    readonly
                >

            </div>

        </div>


        <!-- PAYMENT METHOD -->

        <div class="payment-box">

            <h3>
                Payment Method
            </h3>

            <label for="paymentMethodSelect">
                Select payment method
            </label>

            <select
                id="paymentMethodSelect"
                onchange="paymentMethodChanged()"
                disabled
            >

                <option value="">
                    Select an offer first
                </option>

            </select>

        </div>


        <!-- CALCULATION -->

        <div class="calculation">

            <div class="calc-row">

                <span>
                    Price
                </span>

                <strong id="calcRate">
                    -
                </strong>

            </div>


            <div class="calc-row">

                <span>
                    Trading Fee
                </span>

                <strong id="calcFee">
                    -
                </strong>

            </div>


            <div class="calc-row">

                <span>
                    Receive
                </span>

                <strong id="calcReceive">
                    -
                </strong>

            </div>

        </div>


        <div id="status" class="status-message"></div>


        <button
            id="createTradeBtn"
            class="button"
            type="button"
            onclick="createTrade()"
        >
            Create Trade
        </button>

    </section>


    <!-- MY TRADE -->

    <section class="card">

        <div class="section-title">
            My Trade
        </div>


        <div id="myTrade">

            <div class="empty">
                No active trade.
            </div>

        </div>

    </section>


</div>


<footer>

    CryptoVault P2P Marketplace

</footer>


<script>


/* ============================================================
   SUPABASE
============================================================ */


const SUPABASE_URL =
    "https://zihxnxnviknexlqjjdot.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_A5KO4RzERX6ZOTR5vPS4kQ_GkmbxNlc";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ============================================================
   STATE
============================================================ */


let marketSide = "buy";

let selectedOffer = null;

let selectedPaymentMethod = null;

let selectedTrade = null;

let currentUserId = null;

let chatRefreshTimer = null;

let chatSending = false;


/* ============================================================
   TRADE STATUS
============================================================ */


const STATUS_ORDER = [

    "awaiting_payment",

    "payment_sent",

    "payment_confirmed",

    "crypto_released",

    "completed"

];


const STATUS_LABELS = {

    awaiting_payment:
        "Awaiting Payment",

    payment_sent:
        "Payment Sent",

    payment_confirmed:
        "Payment Confirmed",

    crypto_released:
        "Crypto Released",

    completed:
        "Completed",

    cancelled:
        "Cancelled",

    expired:
        "Expired",

    disputed:
        "Disputed",

    pending:
        "Pending"

};


/* ============================================================
   AUTH
============================================================ */


async function getCurrentUser() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {

            console.error(
                "Session error:",
                result.error
            );

            currentUserId = null;

            return null;

        }

        const session =
            result.data.session;

        if (!session) {

            currentUserId = null;

            return null;

        }

        currentUserId =
            session.user.id;

        return session.user;

    } catch (error) {

        console.error(
            "Auth error:",
            error
        );

        currentUserId = null;

        return null;

    }

}


/* ============================================================
   MARKET SELECTION
============================================================ */


function setMarket(side) {

    marketSide =
        side === "sell"
            ? "sell"
            : "buy";

    selectedOffer = null;

    selectedPaymentMethod = null;

    clearTradeForm();

    updateTabs();

    updateMarketTitle();

    refreshMarket();

}


function marketChanged() {

    selectedOffer = null;

    selectedPaymentMethod = null;

    clearTradeForm();

    updateMarketTitle();

    refreshMarket();

}


function updateTabs() {

    document
        .getElementById("buyTab")
        .classList.toggle(
            "active",
            marketSide === "buy"
        );

    document
        .getElementById("sellTab")
        .classList.toggle(
            "active",
            marketSide === "sell"
        );

}


function updateMarketTitle() {

    const asset =
        document.getElementById(
            "assetSelect"
        ).value;

    const fiat =
        document.getElementById(
            "fiatSelect"
        ).value;

    if (marketSide === "buy") {

        document.getElementById(
            "marketTitle"
        ).textContent =
            `Buy ${asset} with ${fiat}`;

        document.getElementById(
            "heroTitle"
        ).textContent =
            `Buy ${asset}`;

        document.getElementById(
            "heroText"
        ).textContent =
            `Buy ${asset} from P2P traders.`;

        document.getElementById(
            "amountLabel"
        ).textContent =
            `Amount (${fiat})`;

    } else {

        document.getElementById(
            "marketTitle"
        ).textContent =
            `Sell ${asset} for ${fiat}`;

        document.getElementById(
            "heroTitle"
        ).textContent =
            `Sell ${asset}`;

        document.getElementById(
            "heroText"
        ).textContent =
            `Sell ${asset} to P2P traders.`;

        document.getElementById(
            "amountLabel"
        ).textContent =
            `Amount (${asset})`;

    }

}


/* ============================================================
   CLEAR TRADE FORM
============================================================ */


function clearTradeForm() {

    const amount =
        document.getElementById(
            "quickAmount"
        );

    if (amount) {

        amount.value = "";

    }


    const trader =
        document.getElementById(
            "selectedTrader"
        );

    if (trader) {

        trader.value =
            "No offer selected";

    }


    const paymentSelect =
        document.getElementById(
            "paymentMethodSelect"
        );

    if (paymentSelect) {

        paymentSelect.disabled = true;

        paymentSelect.innerHTML =
            `
            <option value="">
                Select an offer first
            </option>
            `;

    }


    showStatus(
        "",
        "info"
    );

    const statusBox =
        document.getElementById(
            "status"
        );

    if (statusBox) {

        statusBox.style.display =
            "none";

    }


    calculateTrade();

}


/* ============================================================
   LOAD OFFERS
============================================================ */


async function loadOffers() {

    const asset =
        document.getElementById(
            "assetSelect"
        ).value;

    const fiat =
        document.getElementById(
            "fiatSelect"
        ).value;

    const result =
        await supabaseClient
            .from("p2p_offers")
            .select("*")
            .eq("status", "active")
            .eq("side", marketSide)
            .eq("asset", asset)
            .eq("fiat", fiat)
            .order(
                "price",
                {
                    ascending:
                        marketSide === "buy"
                }
            );

    if (result.error) {

        console.error(
            "Offer loading error:",
            result.error
        );

        return [];

    }

    return result.data || [];

}


/* ============================================================
   LOAD OFFER PAYMENT METHODS
============================================================ */


async function loadPaymentMethods(offers) {

    if (
        !offers ||
        offers.length === 0
    ) {

        return offers || [];

    }


    const results =
        await Promise.all(

            offers.map(
                async offer => {

                    const result =
                        await supabaseClient.rpc(
                            "get_offer_payment_methods",
                            {
                                p_offer_id:
                                    offer.id
                            }
                        );

                    if (result.error) {

                        console.error(
                            "Payment method error:",
                            result.error
                        );

                        return {
                            ...offer,
                            methods: []
                        };

                    }

                    const methods =
                        (result.data || [])
                            .map(
                                method => ({

                                    id:
                                        method.payment_method_id,

                                    name:
                                        method.payment_method_name,

                                    account_name:
                                        method.account_name,

                                    account_identifier:
                                        method.account_identifier

                                })
                            );

                    return {

                        ...offer,

                        methods

                    };

                }
            )

        );

    return results;

}


/* ============================================================
   LOAD TRADER DATA
============================================================ */


async function enrichOffers(offers) {

    if (
        !offers ||
        offers.length === 0
    ) {

        return [];

    }


    const traderIds =
        [
            ...new Set(
                offers
                    .map(
                        offer =>
                            offer.trader_id
                    )
                    .filter(Boolean)
            )
        ];


    if (traderIds.length === 0) {

        return offers;

    }


    let profiles = [];

    let stats = [];


    const profilesResult =
        await supabaseClient
            .from("profiles")
            .select("*")
            .in("id", traderIds);


    if (!profilesResult.error) {

        profiles =
            profilesResult.data || [];

    }


    const statsResult =
        await supabaseClient
            .from("trader_stats")
            .select("*")
            .in("user_id", traderIds);


    if (!statsResult.error) {

        stats =
            statsResult.data || [];

    }


    return offers.map(
        offer => {

            const profile =
                profiles.find(
                    item =>
                        String(item.id) ===
                        String(offer.trader_id)
                );


            const traderStats =
                stats.find(
                    item =>
                        String(item.user_id) ===
                        String(offer.trader_id)
                );


            return {

                ...offer,

                profile,

                traderStats

            };

        }
    );

}

/* ============================================================
   SELECT OFFER
============================================================ */


async function selectOffer(
    offerId,
    offers
) {

    const offer =
        offers.find(
            item =>
                String(item.id) ===
                String(offerId)
        );


    if (!offer) {

        showStatus(
            "Offer not found.",
            "error"
        );

        return;

    }


    selectedOffer =
        offer;


    selectedPaymentMethod =
        null;


    const trader =
        offer.profile || {};


    const traderName =
        trader.full_name ||
        trader.username ||
        trader.name ||
        "Trader";


    document.getElementById(
        "selectedTrader"
    ).value =
        traderName;


    const paymentSelect =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (paymentSelect) {

        paymentSelect.disabled =
            true;

        paymentSelect.innerHTML =
            `
            <option value="">
                Loading payment methods...
            </option>
            `;

    }


    showStatus(
        "Loading payment methods...",
        "info"
    );


    await loadPaymentMethodSelector(
        offer
    );


    calculateTrade();


    const amountInput =
        document.getElementById(
            "quickAmount"
        );


    if (amountInput) {

        amountInput.focus();

    }

}


/* ============================================================
   PAYMENT METHOD SELECTOR
============================================================ */


async function loadPaymentMethodSelector(
    offer
) {

    const select =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (!select) {

        return;

    }


    select.disabled =
        true;


    select.innerHTML =
        `
        <option value="">
            Loading payment methods...
        </option>
        `;


    try {

        const result =
            await supabaseClient.rpc(
                "get_offer_payment_methods",
                {
                    p_offer_id:
                        offer.id
                }
            );


        if (result.error) {

            console.error(
                "Payment method RPC error:",
                result.error
            );


            select.innerHTML =
                `
                <option value="">
                    Unable to load payment methods
                </option>
                `;


            showStatus(
                result.error.message ||
                "Payment methods could not be loaded.",
                "error"
            );


            return;

        }


        const methods =
            result.data || [];


        console.log(
            "Payment methods returned:",
            methods
        );


        offer.methods =
            methods.map(
                method => ({

                    id:
                        method.payment_method_id,

                    name:
                        method.payment_method_name,

                    account_name:
                        method.account_name,

                    account_identifier:
                        method.account_identifier

                })
            );


        if (
            offer.methods.length === 0
        ) {

            select.innerHTML =
                `
                <option value="">
                    No active payment method
                </option>
                `;


            showStatus(
                "This trader has no active payment method for this offer.",
                "warning"
            );


            return;

        }


        select.innerHTML =
            `
            <option value="">
                Select payment method
            </option>
            `;


        offer.methods.forEach(
            method => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(
                        method.id
                    );


                option.textContent =
                    method.name;


                select.appendChild(
                    option
                );

            }
        );


        select.disabled =
            false;


        showStatus(
            `${offer.methods.length} payment method${offer.methods.length === 1 ? "" : "s"} loaded.`,
            "success"
        );


    } catch (error) {

        console.error(
            "Payment method loading exception:",
            error
        );


        select.innerHTML =
            `
            <option value="">
                Payment method loading failed
            </option>
            `;


        showStatus(
            "Payment methods could not be loaded.",
            "error"
        );

    }

}

   PAYMENT METHOD CHANGED

function paymentMethodChanged() {

    const select =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (!selectedOffer) {

        selectedPaymentMethod =

        return;

    }

            .find(

                    String(method.id) ===

            ) || null;

        showStatus(
            `Payment method selected: ${selectedPaymentMethod.name}`,

        );

    }

}


/* ============================================================
   CALCULATE TRADE
============================================================ */


function calculateTrade() {

    const amount =
        parseFloat(
            document.getElementById(
                "quickAmount"
            ).value
        ) || 0;


    const rate =
        selectedOffer
            ? Number(
                selectedOffer.price
            )
            : 0;


    const asset =
        document.getElementById(
            "assetSelect"
        ).value;


    const fiat =
        document.getElementById(
            "fiatSelect"
        ).value;


    if (
        !selectedOffer ||
        !rate ||
        amount <= 0
    ) {

        document.getElementById(
            "calcRate"
        ).textContent =
            "-";


        document.getElementById(
            "calcFee"
        ).textContent =
            "-";


        document.getElementById(
            "calcReceive"
        ).textContent =
            "-";


        return;

    }


    const feeRate =
        0.005;


    if (
        marketSide === "buy"
    ) {

        const cryptoAmount =
            amount / rate;


        const tradingFee =
            cryptoAmount *
            feeRate;


        const receiveAmount =
            cryptoAmount -
            tradingFee;


        document.getElementById(
            "calcRate"
        ).textContent =
            `${formatNumber(
                rate
            )} ${fiat}`;


        document.getElementById(
            "calcFee"
        ).textContent =
            `${formatNumber(
                tradingFee
            )} ${asset}`;


        document.getElementById(
            "calcReceive"
        ).textContent =
            `${formatNumber(
                receiveAmount
            )} ${asset}`;

    } else {

        const cryptoAmount =
            amount;


        const fiatAmount =
            cryptoAmount *
            rate;


        const tradingFee =
            cryptoAmount *
            feeRate;


        document.getElementById(
            "calcRate"
        ).textContent =
            `${formatNumber(
                rate
            )} ${fiat}`;


        document.getElementById(
            "calcFee"
        ).textContent =
            `${formatNumber(
                tradingFee
            )} ${asset}`;


        document.getElementById(
            "calcReceive"
        ).textContent =
            `${formatNumber(
                fiatAmount
            )} ${fiat}`;

    }

}


/* ============================================================
   CREATE TRADE
============================================================ */


async function createTrade() {

    const button =
        document.getElementById(
            "createTradeBtn"
        );


    button.disabled =
        true;


    try {

        if (!selectedOffer) {

            showStatus(
                "Please select an offer first.",
                "error"
            );

            return;

        }


        if (!selectedPaymentMethod) {

            showStatus(
                "Please select a payment method.",
                "error"
            );

            return;

        }


        const amount =
            parseFloat(
                document.getElementById(
                    "quickAmount"
                ).value
            ) || 0;


        if (amount <= 0) {

            showStatus(
                "Please enter a valid amount.",
                "error"
            );

            return;

        }


        const user =
            await getCurrentUser();


        if (!user) {

            showStatus(
                "Please log in before creating a trade.",
                "error"
            );

            return;

        }


        if (
            String(user.id) ===
            String(
                selectedOffer.trader_id
            )
        ) {

            showStatus(
                "You cannot trade with your own offer.",
                "error"
            );

            return;

        }


        const price =
            Number(
                selectedOffer.price
            );


        if (
            !price ||
            price <= 0
        ) {

            showStatus(
                "Invalid offer price.",
                "error"
            );

            return;

        }


        let cryptoAmount;

        let fiatAmount;


        if (
            marketSide === "buy"
        ) {

            fiatAmount =
                amount;

            cryptoAmount =
                amount / price;

        } else {

            cryptoAmount =
                amount;

            fiatAmount =
                amount * price;

        }


        const minimum =
            Number(
                selectedOffer.min_amount || 0
            );


        const maximum =
            Number(
                selectedOffer.max_amount || 0
            );


        const available =
            Number(
                selectedOffer.available_amount || 0
            );


        if (
            cryptoAmount < minimum
        ) {

            showStatus(
                `Minimum amount is ${formatNumber(
                    minimum
                )} ${selectedOffer.asset}.`,
                "error"
            );

            return;

        }


        if (
            maximum > 0 &&
            cryptoAmount > maximum
        ) {

            showStatus(
                `Maximum amount is ${formatNumber(
                    maximum
                )} ${selectedOffer.asset}.`,
                "error"
            );

            return;

        }


        if (
            cryptoAmount > available
        ) {

            showStatus(
                `Only ${formatNumber(
                    available
                )} ${selectedOffer.asset} is available.`,
                "error"
            );

            return;

        }


        const tradingFee =
            cryptoAmount *
            0.005;


        const expiresAt =
            new Date(
                Date.now() +
                30 * 60 * 1000
            ).toISOString();


        const result =
            await supabaseClient.rpc(
                "create_p2p_trade",
                {

                    p_offer_id:
                        selectedOffer.id,

                    p_crypto_amount:
                        cryptoAmount,

                    p_fiat_amount:
                        fiatAmount,

                    p_price:
                        price,

                    p_trading_fee:
                        tradingFee,

                    p_payment_method_id:
                        selectedPaymentMethod.id,

                    p_expires_at:
                        expiresAt

                }
            );


        if (result.error) {

            console.error(
                "Create trade error:",
                result.error
            );


            showStatus(
                result.error.message ||
                "Trade could not be created.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        if (!selectedTrade) {

            showStatus(
                "Trade was not created.",
                "error"
            );

            return;

        }


        showStatus(
            "Trade created successfully. Seller crypto has been reserved.",
            "success"
        );


        renderMyTrade(
            selectedTrade
        );


        document
            .getElementById(
                "myTrade"
            )
            .scrollIntoView({
                behavior:
                    "smooth"
            });


        await refreshMarket();


    } catch (error) {

        console.error(
            "Create trade exception:",
            error
        );


        showStatus(
            "Something went wrong while creating the trade.",
            "error"
        );

    } finally {

        button.disabled =
            false;

    }

}


/* ============================================================
   SAVE PAYMENT REFERENCE
============================================================ */


async function submitPaymentReference() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "paymentReferenceInput"
        );


    if (!input) {

        return;

    }


    const reference =
        input.value.trim();


    if (!reference) {

        showStatus(
            "Please enter the payment reference.",
            "error"
        );

        return;

    }


    if (
        reference.length < 3
    ) {

        showStatus(
            "Payment reference is too short.",
            "error"
        );

        return;

    }


    if (
        reference.length > 150
    ) {

        showStatus(
            "Payment reference is too long.",
            "error"
        );

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "save_payment_reference",
                {

                    p_trade_id:
                        selectedTrade.id,

                    p_payment_reference:
                        reference

                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Payment reference could not be saved.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Payment reference saved successfully.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while saving the payment reference.",
            "error"
        );

    }

}


/* ============================================================
   MARK PAYMENT SENT
============================================================ */


async function markTradePaymentSent() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status !==
        "awaiting_payment"
    ) {

        showStatus(
            "This trade is no longer awaiting payment.",
            "warning"
        );

        return;

    }


    if (
        String(currentUserId) !==
        String(selectedTrade.buyer_id)
    ) {

        showStatus(
            "Only the buyer can mark payment as sent.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Have you actually sent the payment to the seller?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "mark_payment_sent",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Payment could not be marked as sent.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Payment marked as sent. Waiting for seller confirmation.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong.",
            "error"
        );

    }

}


/* ============================================================
   CONFIRM PAYMENT RECEIVED
============================================================ */


async function confirmPaymentReceived() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status !==
        "payment_sent"
    ) {

        showStatus(
            "This trade is not waiting for payment confirmation.",
            "warning"
        );

        return;

    }


    if (
        String(currentUserId) !==
        String(selectedTrade.seller_id)
    ) {

        showStatus(
            "Only the seller can confirm payment.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Have you checked your payment account and actually received the buyer's payment?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "confirm_payment_received",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Payment confirmation failed.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Payment confirmed. Crypto is ready for release.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while confirming payment.",
            "error"
        );

    }

}


/* ============================================================
   RELEASE CRYPTO
============================================================ */


async function releaseCrypto() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status !==
        "payment_confirmed"
    ) {

        showStatus(
            "Crypto cannot be released at this stage.",
            "warning"
        );

        return;

    }


    if (
        String(currentUserId) !==
        String(selectedTrade.seller_id)
    ) {

        showStatus(
            "Only the seller can release crypto.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Confirm that you received the buyer's payment. Release the crypto?"
        );


    if (!confirmed) {

        return;

    }


    const button =
        document.getElementById(
            "releaseCryptoButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Releasing...";

    }


    try {

        const result =
            await supabaseClient.rpc(
                "release_p2p_crypto",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Crypto release failed.",
                "error"
            );


            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "Release Crypto";

            }


            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Crypto released successfully.",
            "success"
        );


        await refreshMarket();


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while releasing crypto.",
            "error"
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Release Crypto";

        }

    }

}


/* ============================================================
   CANCEL TRADE
============================================================ */


async function cancelTrade() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    const allowedStatuses = [

        "awaiting_payment",

        "payment_sent"

    ];


    if (
        !allowedStatuses.includes(
            selectedTrade.status
        )
    ) {

        showStatus(
            "This trade cannot be cancelled at this stage.",
            "warning"
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to cancel this trade?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "cancel_p2p_trade",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Trade cancellation failed.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        await refreshMarket();


        showStatus(
            "Trade cancelled. Reserved crypto was returned to the seller.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while cancelling the trade.",
            "error"
        );

    }

}

/* ============================================================
   CONVERSATION HTML
============================================================ */


function renderConversationHTML(
    trade
) {

    const participant =
        isTradeParticipant(
            trade
        );


    if (!participant) {

        return "";

    }


    const closedStatuses = [

        "cancelled",

        "expired"

    ];


    const chatClosed =
        closedStatuses.includes(
            trade.status
        );


    return `

        <div class="conversation">

            <div class="conversation-header">

                <div>

                    <div class="conversation-title">
                        Trade Conversation
                    </div>

                    <div class="conversation-status">
                        Chat with the other trader
                    </div>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="chat-loading">
                    Loading conversation...
                </div>

            </div>


            ${
                chatClosed
                    ?
                    `
                    <div class="chat-locked">

                        This trade is closed.

                        You can view the conversation history,
                        but new messages are disabled here.

                    </div>
                    `
                    :
                    `
                    <div class="message-input-area">

                        <textarea
                            id="messageInput"
                            class="message-input"
                            maxlength="1000"
                            placeholder="Write a message..."
                            oninput="updateMessageCounter()"
                            onkeydown="handleMessageKeydown(event)"
                        ></textarea>


                        <button
                            id="sendMessageButton"
                            type="button"
                            class="button send-message-button"
                            onclick="sendTradeMessage()"
                        >
                            Send Message
                        </button>

                    </div>


                    <div
                        id="messageCounter"
                        class="chat-counter"
                    >
                        0 / 1000
                    </div>


                    <div class="chat-locked">

                        Do not share passwords, private keys,
                        recovery phrases, or other account
                        credentials in the conversation.

                    </div>
                    `
            }

        </div>

    `;

}


/* ============================================================
   CHECK TRADE PARTICIPANT
============================================================ */


function isTradeParticipant(
    trade
) {

    if (
        !trade ||
        !currentUserId
    ) {

        return false;

    }


    return (
        String(currentUserId) ===
        String(trade.buyer_id)
    ) ||
    (
        String(currentUserId) ===
        String(trade.seller_id)
    );

}


/* ============================================================
   LOAD TRADE MESSAGES
============================================================ */


async function loadTradeMessages(
    tradeId
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (
        !container ||
        !tradeId ||
        !selectedTrade
    ) {

        return;

    }


    if (
        String(selectedTrade.id) !==
        String(tradeId)
    ) {

        return;

    }


    if (
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("trade_messages")
                .select(
                    "id, trade_id, sender_id, message, created_at"
                )
                .eq(
                    "trade_id",
                    tradeId
                )
                .order(
                    "created_at",
                    {
                        ascending:
                            true
                    }
                );


        if (result.error) {

            console.error(
                "Message loading error:",
                result.error
            );


            container.innerHTML =
                `
                <div class="chat-empty">
                    Could not load conversation.
                </div>
                `;

            return;

        }


        const messages =
            result.data || [];


        renderMessages(
            messages
        );


    } catch (error) {

        console.error(
            "Message loading exception:",
            error
        );


        container.innerHTML =
            `
            <div class="chat-empty">
                Could not load conversation.
            </div>
            `;

    }

}


/* ============================================================
   RENDER MESSAGES
============================================================ */


function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {

        return;

    }


    const wasNearBottom =
        container.scrollTop +
        container.clientHeight >=
        container.scrollHeight - 100;


    if (
        !messages ||
        messages.length === 0
    ) {

        container.innerHTML =
            `
            <div class="chat-empty">

                No messages yet.<br>

                Start the conversation with
                the other trader.

            </div>
            `;

        return;

    }


    container.innerHTML =
        messages
            .map(
                message => {

                    const mine =
                        String(
                            message.sender_id
                        ) ===
                        String(
                            currentUserId
                        );


                    const rowClass =
                        mine
                            ? "message-row mine"
                            : "message-row theirs";


                    const senderLabel =
                        mine
                            ? "You"
                            : "Other Trader";


                    const time =
                        message.created_at
                            ? new Date(
                                message.created_at
                            ).toLocaleString()
                            : "";


                    const safeMessage =
                        escapeHTML(
                            message.message || ""
                        ).replace(
                            /\n/g,
                            "<br>"
                        );


                    return `

                        <div class="${rowClass}">

                            <div class="message-bubble">

                                <div class="message-sender">
                                    ${escapeHTML(
                                        senderLabel
                                    )}
                                </div>

                                <div>
                                    ${safeMessage}
                                </div>

                                <div class="message-time">
                                    ${escapeHTML(
                                        time
                                    )}
                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    if (
        wasNearBottom
    ) {

        container.scrollTop =
            container.scrollHeight;

    }

}


/* ============================================================
   SEND TRADE MESSAGE
============================================================ */


async function sendTradeMessage() {

    if (chatSending) {

        return;

    }


    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (!currentUserId) {

        showStatus(
            "Please log in to send messages.",
            "error"
        );

        return;

    }


    if (
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        showStatus(
            "Only trade participants can send messages.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status ===
            "cancelled" ||
        selectedTrade.status ===
            "expired"
    ) {

        showStatus(
            "Messages are disabled for this closed trade.",
            "warning"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        showStatus(
            "Please enter a message.",
            "error"
        );

        return;

    }


    if (
        message.length > 1000
    ) {

        showStatus(
            "Message is too long. Maximum is 1000 characters.",
            "error"
        );

        return;

    }


    chatSending =
        true;


    const button =
        document.getElementById(
            "sendMessageButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Sending...";

    }


    try {

        const result =
            await supabaseClient
                .from("trade_messages")
                .insert({

                    trade_id:
                        selectedTrade.id,

                    sender_id:
                        currentUserId,

                    message:
                        message

                })
                .select(
                    "id, trade_id, sender_id, message, created_at"
                )
                .single();


        if (result.error) {

            console.error(
                "Send message error:",
                result.error
            );


            showStatus(
                result.error.message ||
                "Message could not be sent.",
                "error"
            );

            return;

        }


        input.value =
            "";


        updateMessageCounter();


        await loadTradeMessages(
            selectedTrade.id
        );


    } catch (error) {

        console.error(
            "Send message exception:",
            error
        );


        showStatus(
            "Something went wrong while sending the message.",
            "error"
        );

    } finally {

        chatSending =
            false;


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Send Message";

        }

    }

}


/* ============================================================
   MESSAGE COUNTER
============================================================ */


function updateMessageCounter() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const counter =
        document.getElementById(
            "messageCounter"
        );


    if (
        !input ||
        !counter
    ) {

        return;

    }


    counter.textContent =
        `${input.value.length} / 1000`;

}


/* ============================================================
   ENTER TO SEND
============================================================ */


function handleMessageKeydown(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendTradeMessage();

    }

}


/* ============================================================
   AUTOMATIC CHAT REFRESH
============================================================ */


function startChatRefresh() {

    stopChatRefresh();


    if (
        !selectedTrade ||
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        return;

    }


    chatRefreshTimer =
        setInterval(
            async () => {

                if (
                    !selectedTrade ||
                    !currentUserId
                ) {

                    stopChatRefresh();

                    return;

                }


                const messagesElement =
                    document.getElementById(
                        "messages"
                    );


                if (!messagesElement) {

                    return;

                }


                await loadTradeMessages(
                    selectedTrade.id
                );

            },
            5000
        );

}


/* ============================================================
   STOP CHAT REFRESH
============================================================ */


function stopChatRefresh() {

    if (
        chatRefreshTimer
    ) {

        clearInterval(
            chatRefreshTimer
        );

        chatRefreshTimer =
            null;

    }

}


/* ============================================================
   STATUS STEPS
============================================================ */


function renderStatusSteps(
    currentStatus
) {

    const currentIndex =
        STATUS_ORDER.indexOf(
            currentStatus
        );


    return STATUS_ORDER
        .map(
            (
                status,
                index
            ) => {

                let className =
                    "status-step";


                if (
                    currentIndex >= 0 &&
                    index < currentIndex
                ) {

                    className +=
                        " done";

                }


                if (
                    status ===
                    currentStatus
                ) {

                    className +=
                        " current";

                }


                return `

                    <div class="${className}">

                        ${escapeHTML(
                            statusLabel(
                                status
                            )
                        )}

                    </div>

                `;

            }
        )
        .join("");

}


/* ============================================================
   STATUS LABEL
============================================================ */


function statusLabel(
    status
) {

    return (
        STATUS_LABELS[status] ||
        status ||
        "Unknown"
    );

}


/* ============================================================
   STATUS MESSAGE
============================================================ */


function showStatus(
    message,
    type = "info"
) {

    const box =
        document.getElementById(
            "status"
        );


    if (!box) {

        return;

    }


    box.textContent =
        message;


    box.className =
        "status-message " +
        type;


    if (!message) {

        box.style.display =
            "none";

    } else {

        box.style.display =
            "block";

    }

}


/* ============================================================
   NUMBER FORMAT
============================================================ */


function formatNumber(
    value
) {

    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return "0";

    }


    return number.toLocaleString(
        undefined,
        {
            maximumFractionDigits:
                8
        }
    );

}


/* ============================================================
   HTML ESCAPE
============================================================ */


function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   URL PARAMETERS
============================================================ */


function applyURLParameters() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const type =
        params.get("type");


    const asset =
        params.get("asset");


    if (
        type &&
        type.toLowerCase() ===
        "sell"
    ) {

        marketSide =
            "sell";

    } else {

        marketSide =
            "buy";

    }


    if (asset) {

        const upper =
            asset.toUpperCase();


        if (
            [
                "USDT",
                "BTC",
                "ETH"
            ].includes(
                upper
            )
        ) {

            document
                .getElementById(
                    "assetSelect"
                )
                .value =
                    upper;

        }

    }


    updateTabs();

}


/* ============================================================
   LOAD EXISTING TRADE
============================================================ */


async function loadExistingTrade() {

    if (!currentUserId) {

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("p2p_trades")
                .select("*")
                .or(
                    `buyer_id.eq.${currentUserId},seller_id.eq.${currentUserId}`
                )
                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )
                .limit(1)
                .maybeSingle();


        if (result.error) {

            console.warn(
                "Existing trade:",
                result.error.message
            );

            return;

        }


        if (result.data) {

            selectedTrade =
                result.data;


            renderMyTrade(
                result.data
            );

        }

    } catch (error) {

        console.warn(
            "Existing trade exception:",
            error
        );

    }

}


/* ============================================================
   AUTH STATE CHANGES
============================================================ */


supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if (session) {

            currentUserId =
                session.user.id;


            await loadExistingTrade();

        } else {

            currentUserId =
                null;


            selectedTrade =
                null;


            selectedOffer =
                null;


            selectedPaymentMethod =
                null;


            stopChatRefresh();


            const myTrade =
                document.getElementById(
                    "myTrade"
                );


            if (myTrade) {

                myTrade.innerHTML =
                    `
                    <div class="empty">
                        Please log in to view your trades.
                    </div>
                    `;

            }

        }

    }
);


/* ============================================================
   PAGE START
============================================================ */


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        applyURLParameters();

        updateMarketTitle();

        clearTradeForm();

        await getCurrentUser();

        await refreshMarket();

        await loadExistingTrade();

    }
);


</script>
