/* ============================================================
   AUTH
============================================================ */

async function getCurrentUser() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {

            console.error(
                "Session error:",
                result.error
            );

            currentUserId = null;

            return null;

        }

        const session =
            result.data.session;

        if (!session) {

            currentUserId = null;

            return null;

        }

        currentUserId =
            session.user.id;

        return session.user;

    } catch (error) {

        console.error(
            "Auth error:",
            error
        );

        currentUserId = null;

        return null;

    }

}

/* ============================================================
   LOAD OFFERS
============================================================ */

/*
 * VERY IMPORTANT:
 *
 * BUY MARKET:
 * User wants to BUY crypto.
 * Therefore we show traders' SELL offers.
 *
 * SELL MARKET:
 * User wants to SELL crypto.
 * Therefore we show traders' BUY offers.
 */

async function loadOffers() {

    const asset =
        document.getElementById(
            "assetSelect"
        ).value;

    const fiat =
        document.getElementById(
            "fiatSelect"
        ).value;


    const offerSide =
        marketSide === "buy"
            ? "sell"
            : "buy";


    console.log(
        "Loading P2P offers:",
        {
            marketSide:
                marketSide,

            offerSide:
                offerSide,

            asset:
                asset,

            fiat:
                fiat
        }
    );


    const result =
        await supabaseClient
            .from("p2p_offers")
            .select("*")
            .eq(
                "status",
                "active"
            )
            .eq(
                "side",
                offerSide
            )
            .eq(
                "asset",
                asset
            )
            .eq(
                "fiat",
                fiat
            )
            .order(
                "price",
                {
                    ascending:
                        marketSide === "buy"
                }
            );


    if (result.error) {

        console.error(
            "Offer loading error:",
            result.error
        );

        showStatus(
            result.error.message ||
            "Could not load P2P offers.",
            "error"
        );

        return [];

    }


    console.log(
        "P2P offers found:",
        result.data
    );


    return result.data || [];

}


/* ============================================================
   LOAD OFFER PAYMENT METHODS
============================================================ */

async function loadPaymentMethods(offers) {

    if (
        !offers ||
        offers.length === 0
    ) {

        return offers || [];

    }


    const results =
        await Promise.all(

            offers.map(
                async offer => {

                    const result =
                        await supabaseClient.rpc(
                            "get_offer_payment_methods",
                            {
                                p_offer_id:
                                    offer.id
                            }
                        );


                    if (result.error) {

                        console.error(
                            "Payment method error:",
                            result.error
                        );

                        return {
                            ...offer,
                            methods: []
                        };

                    }


                    const methods =
                        (result.data || [])
                            .map(
                                method => ({

                                    id:
                                        method.payment_method_id,

                                    name:
                                        method.payment_method_name,

                                    account_name:
                                        method.account_name,

                                    account_identifier:
                                        method.account_identifier

                                })
                            );


                    return {

                        ...offer,

                        methods

                    };

                }
            )

        );


    return results;

}


/* ============================================================
   LOAD TRADER DATA
============================================================ */

async function enrichOffers(offers) {

    if (
        !offers ||
        offers.length === 0
    ) {

        return [];

    }


    const traderIds =
        [
            ...new Set(
                offers
                    .map(
                        offer =>
                            offer.trader_id
                    )
                    .filter(Boolean)
            )
        ];


    if (
        traderIds.length === 0
    ) {

        return offers;

    }


    let profiles = [];

    let stats = [];


    const profilesResult =
        await supabaseClient
            .from("profiles")
            .select("*")
            .in(
                "id",
                traderIds
            );


    if (!profilesResult.error) {

        profiles =
            profilesResult.data || [];

    } else {

        console.warn(
            "Profile loading error:",
            profilesResult.error
        );

    }


    const statsResult =
        await supabaseClient
            .from("trader_stats")
            .select("*")
            .in(
                "user_id",
                traderIds
            );


    if (!statsResult.error) {

        stats =
            statsResult.data || [];

    } else {

        console.warn(
            "Trader stats loading error:",
            statsResult.error
        );

    }


    return offers.map(
        offer => {

            const profile =
                profiles.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(
                            offer.trader_id
                        )
                );


            const traderStats =
                stats.find(
                    item =>
                        String(
                            item.user_id
                        ) ===
                        String(
                            offer.trader_id
                        )
                );


            return {

                ...offer,

                profile,

                traderStats

            };

        }
    );

}


/* ============================================================
   REFRESH MARKET
============================================================ */

async function refreshMarket() {

    updateMarketTitle();


    const container =

    }


    container.innerHTML =
        `
        <div class="empty">
            Loading offers...

    try {

        let offers =
            await loadOffers();


        offers =
            await enrichOffers(
                offers
            );


        offers =
            await loadPaymentMethods(
                offers
            );


        renderOffers(
            offers

    } catch (error) {

        console.error(
            "Market error:",
            error
        );


        container.innerHTML =
            `
            <div class="empty">
                Could not load offers.
                Please refresh the page.
            </div>
            `;

    }

}

   RENDER OFFERS

            "assetSelect"
        ).value;

        ).value;

     * EMPTY OFFER FIX
     */

        !offers ||
        offers.length === 0
    ) {

        container.innerHTML =
            `
            <div class="empty">

                No active offers are available for

                <strong>
                    ${escapeHTML(asset)}
                    /
                    ${escapeHTML(fiat)}
                </strong>.

                <br><br>

                ${
                    marketSide === "buy"
                        ?
                        "Traders need active SELL offers for this market."
                        :
                        "Traders need active BUY offers for this market."
                }

            `;

    container.innerHTML =
        offers
            .map(
                offer => {

                    const profile =
                        offer.profile || {};


                    const stats =
                        offer.traderStats || {};


                    const traderName =
                        profile.full_name ||
                        profile.username ||
                        profile.name ||
                        "Trader";


                    const completedTrades =
                        stats.completed_trades ??
                        0;


                    const reputation =
                        stats.reputation_score ??
                        stats.completion_rate ??
                        "New";


                    const available =
                        Number(
                            offer.available_amount ||
                            0
                        );


                    const minimum =
                        Number(
                            offer.min_amount ||
                            0
                        );


                    const maximum =
                        Number(
                            offer.max_amount ||
                            0
                        );


                    const methods =
                        offer.methods ||
                        [];


                    const paymentHTML =
                        methods.length
                            ?
                            methods
                                .map(
                                    method =>
                                        `
                                        <span class="payment-tag">
                                            ${escapeHTML(
                                                method.name ||
                                                "Payment"
                                            )}
                                        </span>
                                        `
                                )
                                .join("")
                            :
                            `
                            <span class="payment-tag">
                                No active payment method
                            </span>
                            `;


                    const buttonClass =
                        marketSide === "sell"
                            ? "button sell"
                            : "button";


                    const buttonText =
                        marketSide === "sell"
                            ? `Sell ${asset}`
                            : `Buy ${asset}`;


                    const offerId =
                        String(
                            offer.id
                        );


                    return `

                        <div
                            class="offer"
                            data-offer-card-id="${escapeHTML(
                                offerId
                            )}"
                            role="button"
                            tabindex="0"
                            aria-label="Select offer from ${escapeHTML(
                                traderName
                            )}"
                        >

                            <div class="offer-top">

                                <div>

                                    <div class="trader-name">
                                        ${escapeHTML(
                                            traderName
                                        )}
                                    </div>

                                    <div class="verified">
                                        ✓ Verified Trader
                                    </div>

                                    <span class="selected-label"
                                        style="display:none;">
                                        Selected
                                    </span>

                                </div>


                                <div>

                                    <div class="price">

                                        ${formatNumber(
                                            offer.price
                                        )}

                                        ${escapeHTML(
                                            fiat
                                        )}

                                    </div>

                                    <div class="price-label">

                                        Price per
                                        ${escapeHTML(
                                            asset
                                        )}

                                    </div>

                                </div>

                            </div>


                            <div class="info-grid">

                                <div class="info-box">

                                    <small>
                                        Available
                                    </small>

                                    <strong>

                                        ${formatNumber(
                                            available
                                        )}

                                        ${escapeHTML(
                                            asset
                                        )}

                                    </strong>

                                </div>


                                <div class="info-box">

                                    <small>
                                        Minimum
                                    </small>

                                    <strong>

                                        ${formatNumber(
                                            minimum
                                        )}

                                        ${escapeHTML(
                                            asset
                                        )}

                                    </strong>

                                </div>


                                <div class="info-box">

                                    <small>
                                        Completed
                                    </small>

                                    <strong>

                                        ${escapeHTML(
                                            String(
                                                completedTrades
                                            )
                                        )}

                                    </strong>

                                </div>

                            </div>


                            ${
                                maximum > 0
                                    ?
                                    `
                                    <div class="offer-limit">

                                        Maximum:

                                        <strong>

                                            ${formatNumber(
                                                maximum
                                            )}

                                            ${escapeHTML(
                                                asset
                                            )}

                                        </strong>

                                    </div>
                                    `
                                    :
                                    ""
                            }


                            <div class="offer-reputation">

                                Reputation:

                                <strong>

                                    ${escapeHTML(
                                        String(
                                            reputation
                                        )
                                    )}

                                </strong>

                            </div>


                            <div class="payments">

                                ${paymentHTML}

                            </div>


                            <button
                                type="button"

                                data-offer-id="${escapeHTML(

            .join("");


    /*
     * SELECT OFFER FROM CARD
     */

    const selectOfferFromCard =
        async offerId => {

            container
                .querySelectorAll(
                    ".offer"
                )
                .forEach(
                    card => {

                        card.classList.remove(
                            "selected"
                        );


                        const label =
                            card.querySelector(
                                ".selected-label"
                            );


                        if (label) {

                            label.style.display =

                        }

                    }

                Array.from(
                    container.querySelectorAll(
                        "[data-offer-card-id]"
                    )
                ).find(
                    card =>
                        String(
                            card.dataset.offerCardId
                        ) ===
                        String(
                            offerId
                        )
                );


            if (selectedCard) {

                selectedCard.classList.add(
                    "selected"
                );


                const label =
                    selectedCard.querySelector(
                        ".selected-label"
                    );


                if (label) {

                    label.style.display =
                        "inline-block";

            await selectOffer(
                String(
                    offerId
                ),
                offers
            );

    /*
     * BUTTON CLICK
     */

    container
        .querySelectorAll(
            "[data-offer-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async event => {

                        event.preventDefault();

                        event.stopPropagation();

                        await selectOfferFromCard(
                            button.dataset.offerId
                        );

                    }
                );

            }
        );


    /*
     * CARD CLICK
     */

    container
        .querySelectorAll(
            "[data-offer-card-id]"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    async event => {

                                "[data-offer-id]"
                            )
                        ) {

                        }


                        await selectOfferFromCard(
                            card.dataset.offerCardId

                    "keydown",
                    async event => {

/* ============================================================
   SELECT OFFER
============================================================ */

async function selectOffer(
    offerId,
    offers
) {

    const offer =
        offers.find(
            item =>
                String(
                    item.id
                ) ===
                String(
                    offerId
                )
        );


    if (!offer) {

        showStatus(
            "Offer not found.",
            "error"
        );

        return;

    }


    selectedOffer =
        offer;


    selectedPaymentMethod =
        null;


    const trader =
        offer.profile || {};


    const traderName =
        trader.full_name ||
        trader.username ||
        trader.name ||
        "Trader";


    document.getElementById(
        "selectedTrader"
    ).value =
        traderName;


    const paymentSelect =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (paymentSelect) {

        paymentSelect.disabled =
            true;

        paymentSelect.innerHTML =
            `
            <option value="">
                Loading payment methods...
            </option>
            `;

    }


    showStatus(
        "Loading payment methods...",
        "info"
    );


    await loadPaymentMethodSelector(
        offer
    );


    calculateTrade();


    const amountInput =
        document.getElementById(
            "quickAmount"
        );


    if (amountInput) {

        amountInput.focus();

    }

}


/* ============================================================
   PAYMENT METHOD SELECTOR
============================================================ */

async function loadPaymentMethodSelector(
    offer
) {

    const select =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (!select) {

        return;

    }


    select.disabled =
        true;


    select.innerHTML =
        `
        <option value="">
            Loading payment methods...
        </option>
        `;


    try {

        const result =
            await supabaseClient.rpc(
                "get_offer_payment_methods",
                {
                    p_offer_id:
                        offer.id
                }
            );


        if (result.error) {

            console.error(
                "Payment method RPC error:",
                result.error
            );


            select.innerHTML =
                `
                <option value="">
                    Unable to load payment methods
                </option>
                `;


            showStatus(
                result.error.message ||
                "Payment methods could not be loaded.",
                "error"
            );


            return;

        }


        const methods =
            result.data || [];


        console.log(
            "Payment methods returned:",
            methods
        );


        offer.methods =
            methods.map(
                method => ({

                    id:
                        method.payment_method_id,

                    name:
                        method.payment_method_name,

                    account_name:
                        method.account_name,

                    account_identifier:
                        method.account_identifier

                })
            );


        if (
            offer.methods.length === 0
        ) {

            select.innerHTML =
                `
                <option value="">
                    No active payment method
                </option>
                `;


            showStatus(
                "This trader has no active payment method for this offer.",
                "warning"
            );


            return;

        }


        select.innerHTML =
            `
            <option value="">
                Select payment method
            </option>
            `;


        offer.methods.forEach(
            method => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(
                        method.id
                    );


                option.textContent =
                    method.name;


                select.appendChild(
                    option
                );

            }
        );


        select.disabled =
            false;


        showStatus(
            `${offer.methods.length} payment method${offer.methods.length === 1 ? "" : "s"} loaded.`,
            "success"
        );


    } catch (error) {

        console.error(
            "Payment method loading exception:",
            error
        );


        select.innerHTML =
            `
            <option value="">
                Payment method loading failed
            </option>
            `;


        showStatus(
            "Payment methods could not be loaded.",
            "error"
        );

    }

}


/* ============================================================
   PAYMENT METHOD CHANGED
============================================================ */

function paymentMethodChanged() {

    const select =
        document.getElementById(
            "paymentMethodSelect"
        );


    if (!selectedOffer) {

        selectedPaymentMethod =
            null;

        return;

    }


    selectedPaymentMethod =
        (selectedOffer.methods || [])
            .find(
                method =>
                    String(
                        method.id
                    ) ===
                    String(
                        select.value
                    )
            ) || null;


    if (selectedPaymentMethod) {

        showStatus(
            `Payment method selected: ${selectedPaymentMethod.name}`,
            "success"
        );

    }

}


/* ============================================================
   CALCULATE TRADE
============================================================ */

function calculateTrade() {

    const amount =
        parseFloat(
            document.getElementById(
                "quickAmount"
            ).value
        ) || 0;


    const rate =
        selectedOffer
            ? Number(
                selectedOffer.price
            )
            : 0;


    const asset =
        document.getElementById(
            "assetSelect"
        ).value;


    const fiat =
        document.getElementById(
            "fiatSelect"
        ).value;


    if (
        !selectedOffer ||
        !rate ||
        amount <= 0
    ) {

        document.getElementById(
            "calcRate"
        ).textContent =
            "-";


        document.getElementById(
            "calcFee"
        ).textContent =
            "-";


        document.getElementById(
            "calcReceive"
        ).textContent =
            "-";


        return;

    }


    const feeRate =
        0.005;


    if (
        marketSide === "buy"
    ) {

        const cryptoAmount =
            amount / rate;


        const tradingFee =
            cryptoAmount *
            feeRate;


        const receiveAmount =
            cryptoAmount -
            tradingFee;


        document.getElementById(
            "calcRate"
        ).textContent =
            `${formatNumber(
                rate
            )} ${fiat}`;


        document.getElementById(
            "calcFee"
        ).textContent =
            `${formatNumber(
                tradingFee
            )} ${asset}`;


        document.getElementById(
            "calcReceive"
        ).textContent =
            `${formatNumber(
                receiveAmount
            )} ${asset}`;

    } else {

        const cryptoAmount =
            amount;


        const fiatAmount =
            cryptoAmount *
            rate;


        const tradingFee =
            cryptoAmount *
            feeRate;


        document.getElementById(
            "calcRate"
        ).textContent =
            `${formatNumber(
                rate
            )} ${fiat}`;


        document.getElementById(
            "calcFee"
        ).textContent =
            `${formatNumber(
                tradingFee
            )} ${asset}`;


        document.getElementById(
            "calcReceive"
        ).textContent =
            `${formatNumber(
                fiatAmount
            )} ${fiat}`;

    }

}


/* ============================================================
   CREATE TRADE
============================================================ */

async function createTrade() {

    const button =
        document.getElementById(
            "createTradeBtn"
        );


    button.disabled =
        true;


    try {

        if (!selectedOffer) {

            showStatus(
                "Please select an offer first.",
                "error"
            );

            return;

        }


        if (!selectedPaymentMethod) {

            showStatus(
                "Please select a payment method.",
                "error"
            );

            return;

        }


        const amount =
            parseFloat(
                document.getElementById(
                    "quickAmount"
                ).value
            ) || 0;


        if (amount <= 0) {

            showStatus(
                "Please enter a valid amount.",
                "error"
            );

            return;

        }


        const user =
            await getCurrentUser();


        if (!user) {

            showStatus(
                "Please log in before creating a trade.",
                "error"
            );

            return;

        }


        if (
            String(user.id) ===
            String(
                selectedOffer.trader_id
            )
        ) {

            showStatus(
                "You cannot trade with your own offer.",
                "error"
            );

            return;

        }


        const price =
            Number(
                selectedOffer.price
            );


        if (
            !price ||
            price <= 0
        ) {

            showStatus(
                "Invalid offer price.",
                "error"
            );

            return;

        }


        let cryptoAmount;

        let fiatAmount;


        if (
            marketSide === "buy"
        ) {

            fiatAmount =
                amount;

            cryptoAmount =
                amount / price;

        } else {

            cryptoAmount =
                amount;

            fiatAmount =
                amount * price;

        }


        const minimum =
            Number(
                selectedOffer.min_amount ||
                0
            );


        const maximum =
            Number(
                selectedOffer.max_amount ||
                0
            );


        const available =
            Number(
                selectedOffer.available_amount ||
                0
            );


        if (
            cryptoAmount < minimum
        ) {

            showStatus(
                `Minimum amount is ${formatNumber(
                    minimum
                )} ${selectedOffer.asset}.`,
                "error"
            );

            return;

        }


        if (
            maximum > 0 &&
            cryptoAmount > maximum
        ) {

            showStatus(
                `Maximum amount is ${formatNumber(
                    maximum
                )} ${selectedOffer.asset}.`,
                "error"
            );

            return;

        }


        if (
            cryptoAmount > available
        ) {

            showStatus(
                `Only ${formatNumber(
                    available
                )} ${selectedOffer.asset} is available.`,
                "error"
            );

            return;

        }


        const tradingFee =
            cryptoAmount *
            0.005;


        const expiresAt =
            new Date(
                Date.now() +
                30 * 60 * 1000
            ).toISOString();


        console.log(
            "Creating trade:",
            {
                offerId:
                    selectedOffer.id,

                marketSide:
                    marketSide,

                offerSide:
                    selectedOffer.side,

                cryptoAmount:
                    cryptoAmount,

                fiatAmount:
                    fiatAmount,

                price:
                    price
            }
        );


        const result =
            await supabaseClient.rpc(
                "create_p2p_trade",
                {

                    p_offer_id:
                        selectedOffer.id,

                    p_crypto_amount:
                        cryptoAmount,

                    p_fiat_amount:
                        fiatAmount,

                    p_price:
                        price,

                    p_trading_fee:
                        tradingFee,

                    p_payment_method_id:
                        selectedPaymentMethod.id,

                    p_expires_at:
                        expiresAt

                }
            );


        if (result.error) {

            console.error(
                "Create trade error:",
                result.error
            );


            showStatus(
                result.error.message ||
                "Trade could not be created.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        if (!selectedTrade) {

            showStatus(
                "Trade was not created.",
                "error"
            );

            return;

        }


        showStatus(
            "Trade created successfully. Seller crypto has been reserved.",
            "success"
        );


        renderMyTrade(
            selectedTrade
        );


        document
            .getElementById(
                "myTrade"
            )
            .scrollIntoView({
                behavior:
                    "smooth"
            });


        await refreshMarket();


    } catch (error) {

        console.error(
            "Create trade exception:",
            error
        );


        showStatus(
            "Something went wrong while creating the trade.",
            "error"
        );

    } finally {

        button.disabled =
            false;

    }

}


/* ============================================================
   SAVE PAYMENT REFERENCE
============================================================ */

async function submitPaymentReference() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "paymentReferenceInput"
        );


    if (!input) {

        return;

    }


    const reference =
        input.value.trim();


    if (!reference) {

        showStatus(
            "Please enter the payment reference.",
            "error"
        );

        return;

    }


    if (
        reference.length < 3
    ) {

        showStatus(
            "Payment reference is too short.",
            "error"
        );

        return;

    }


    if (
        reference.length > 150
    ) {

        showStatus(
            "Payment reference is too long.",
            "error"
        );

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "save_payment_reference",
                {

                    p_trade_id:
                        selectedTrade.id,

                    p_payment_reference:
                        reference

                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Payment reference could not be saved.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Payment reference saved successfully.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while saving the payment reference.",
            "error"
        );

    }

}


/* ============================================================
   MARK PAYMENT SENT
============================================================ */

async function markTradePaymentSent() {

    if (!selectedTrade) {

    ) {

    if (

        );

    }


    const confirmed =

    }


    try {

            await supabaseClient.rpc(
                "mark_payment_sent",
                {

                result.error

            showStatus(

        selectedTrade =

        renderMyTrade(

        showStatus(

            "success"
        );


    } catch (error) {

        console.error(
            error

        showStatus(
            "Something went wrong.",

        );

/* ============================================================
   RELEASE CRYPTO
============================================================ */

async function releaseCrypto() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status !==
        "payment_confirmed"
    ) {

        showStatus(
            "Crypto cannot be released at this stage.",
            "warning"
        );

        return;

    }


    if (
        String(currentUserId) !==
        String(
            selectedTrade.seller_id
        )
    ) {

        showStatus(
            "Only the seller can release crypto.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Confirm that you received the buyer's payment. Release the crypto?"
        );


    if (!confirmed) {

        return;

    }


    const button =
        document.getElementById(
            "releaseCryptoButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Releasing...";

    }


    try {

        const result =
            await supabaseClient.rpc(
                "release_p2p_crypto",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Crypto release failed.",
                "error"
            );


            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "Release Crypto";

            }


            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        showStatus(
            "Crypto released successfully.",
            "success"
        );


        await refreshMarket();


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while releasing crypto.",
            "error"
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Release Crypto";

        }

    }

}


/* ============================================================
   CANCEL TRADE
============================================================ */

async function cancelTrade() {

    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    const allowedStatuses = [

        "awaiting_payment",

        "payment_sent"

    ];


    if (
        !allowedStatuses.includes(
            selectedTrade.status
        )
    ) {

        showStatus(
            "This trade cannot be cancelled at this stage.",
            "warning"
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to cancel this trade?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await supabaseClient.rpc(
                "cancel_p2p_trade",
                {
                    p_trade_id:
                        selectedTrade.id
                }
            );


        if (result.error) {

            console.error(
                result.error
            );


            showStatus(
                result.error.message ||
                "Trade cancellation failed.",
                "error"
            );

            return;

        }


        selectedTrade =
            Array.isArray(
                result.data
            )
                ? result.data[0]
                : result.data;


        renderMyTrade(
            selectedTrade
        );


        await refreshMarket();


        showStatus(
            "Trade cancelled. Reserved crypto was returned to the seller.",
            "success"
        );


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "Something went wrong while cancelling the trade.",
            "error"
        );

    }

}

/* ============================================================
   CONVERSATION HTML
============================================================ */

function renderConversationHTML(
    trade
) {

    const participant =
        isTradeParticipant(
            trade
        );


    if (!participant) {

        return "";

    }


    const closedStatuses = [

        "cancelled",

        "expired"

    ];


    const chatClosed =
        closedStatuses.includes(
            trade.status
        );


    return `

        <div class="conversation">

            <div class="conversation-header">

                <div>

                    <div class="conversation-title">
                        Trade Conversation
                    </div>

                    <div class="conversation-status">
                        Chat with the other trader
                    </div>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="chat-loading">
                    Loading conversation...
                </div>

            </div>


            ${
                chatClosed
                    ?
                    `
                    <div class="chat-locked">

                        This trade is closed.

                        You can view the conversation history,
                        but new messages are disabled here.

                    </div>
                    `
                    :
                    `
                    <div class="message-input-area">

                        <textarea

                    <div

                        0 / 1000

                    <div class="chat-locked">

                    `
            }

        </div>

}


/* ============================================================
   CHECK TRADE PARTICIPANT
============================================================ */

function isTradeParticipant(
    trade
) {

    if (
        !trade ||
        !currentUserId
    ) {

        return false;

    }


    return (

        String(
            currentUserId
        ) ===
        String(
            trade.buyer_id
        )

    ) || (

        String(
            currentUserId
        ) ===
        String(
            trade.seller_id
        )

    );

}


/* ============================================================
   LOAD TRADE MESSAGES
============================================================ */

async function loadTradeMessages(
    tradeId
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (
        !container ||
        !tradeId ||
        !selectedTrade
    ) {

        return;

    }


    if (
        String(
            selectedTrade.id
        ) !==
        String(
            tradeId
        )
    ) {

        return;

    }


    if (
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("trade_messages")
                .select(
                    "id, trade_id, sender_id, message, created_at"
                )
                .eq(
                    "trade_id",
                    tradeId
                )
                .order(
                    "created_at",
                    {
                        ascending:
                            true
                    }
                );


        if (result.error) {

            console.error(
                "Message loading error:",
                result.error
            );


            container.innerHTML =
                `
                <div class="chat-empty">
                    Could not load conversation.
                </div>
                `;

            return;

        }


        const messages =
            result.data || [];


        renderMessages(
            messages
        );


    } catch (error) {

        console.error(
            "Message loading exception:",
            error
        );


        container.innerHTML =
            `
            <div class="chat-empty">
                Could not load conversation.
            </div>
            `;

    }

}


/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {

        return;

    }


    const wasNearBottom =
        container.scrollTop +
        container.clientHeight >=
        container.scrollHeight - 100;


    if (
        !messages ||
        messages.length === 0
    ) {

        container.innerHTML =
            `
            <div class="chat-empty">

                No messages yet.<br>

                Start the conversation with
                the other trader.

            </div>
            `;

        return;

    }


    container.innerHTML =
        messages
            .map(
                message => {

                    const mine =
                        String(
                            message.sender_id
                        ) ===
                        String(
                            currentUserId
                        );


                    const rowClass =
                        mine
                            ? "message-row mine"
                            : "message-row theirs";


                    const senderLabel =
                        mine
                            ? "You"
                            : "Other Trader";


                    const time =
                        message.created_at
                            ? new Date(
                                message.created_at
                            ).toLocaleString()
                            : "";


                    const safeMessage =
                        escapeHTML(
                            message.message ||
                            ""
                        ).replace(
                            /\n/g,
                            "<br>"
                        );


                    return `

                        <div class="${rowClass}">

                            <div class="message-bubble">

                                <div class="message-sender">

                                    ${escapeHTML(
                                        senderLabel
                                    )}

                                </div>

                                <div>

                                    ${safeMessage}

                                </div>

                                <div class="message-time">

                                    ${escapeHTML(
                                        time
                                    )}

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    if (
        wasNearBottom
    ) {

        container.scrollTop =
            container.scrollHeight;

    }

}


/* ============================================================
   SEND TRADE MESSAGE
============================================================ */

async function sendTradeMessage() {

    if (chatSending) {

        return;

    }


    if (!selectedTrade) {

        showStatus(
            "No trade is selected.",
            "error"
        );

        return;

    }


    if (!currentUserId) {

        showStatus(
            "Please log in to send messages.",
            "error"
        );

        return;

    }


    if (
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        showStatus(
            "Only trade participants can send messages.",
            "error"
        );

        return;

    }


    if (
        selectedTrade.status ===
            "cancelled" ||
        selectedTrade.status ===
            "expired"
    ) {

        showStatus(
            "Messages are disabled for this closed trade.",
            "warning"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        showStatus(
            "Please enter a message.",
            "error"
        );

        return;

    }


    if (
        message.length > 1000
    ) {

        showStatus(
            "Message is too long. Maximum is 1000 characters.",
            "error"
        );

        return;

    }


    chatSending =
        true;


    const button =
        document.getElementById(
            "sendMessageButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Sending...";

    }


    try {

        const result =
            await supabaseClient
                .from("trade_messages")
                .insert({

                    trade_id:
                        selectedTrade.id,

                    sender_id:
                        currentUserId,

                    message:
                        message

                })
                .select(
                    "id, trade_id, sender_id, message, created_at"
                )
                .single();


        if (result.error) {

            console.error(
                "Send message error:",
                result.error
            );


            showStatus(
                result.error.message ||
                "Message could not be sent.",
                "error"
            );

            return;

        }


        input.value =
            "";


        updateMessageCounter();


        await loadTradeMessages(
            selectedTrade.id
        );


    } catch (error) {

        console.error(
            "Send message exception:",
            error
        );


        showStatus(
            "Something went wrong while sending the message.",
            "error"
        );

    } finally {

        chatSending =
            false;


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Send Message";

        }

    }

}


/* ============================================================
   MESSAGE COUNTER
============================================================ */

function updateMessageCounter() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const counter =
        document.getElementById(
            "messageCounter"
        );


    if (
        !input ||
        !counter
    ) {

        return;

    }


    counter.textContent =
        `${input.value.length} / 1000`;

}


/* ============================================================
   ENTER TO SEND
============================================================ */

function handleMessageKeydown(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendTradeMessage();

    }

}


/* ============================================================
   AUTOMATIC CHAT REFRESH
============================================================ */

function startChatRefresh() {

    stopChatRefresh();


    if (
        !selectedTrade ||
        !isTradeParticipant(
            selectedTrade
        )
    ) {

        return;

    }


    chatRefreshTimer =
        setInterval(
            async () => {

                if (
                    !selectedTrade ||
                    !currentUserId
                ) {

                    stopChatRefresh();

                    return;

                }


                const messagesElement =
                    document.getElementById(
                        "messages"
                    );


                if (!messagesElement) {

                    return;

                }


                await loadTradeMessages(
                    selectedTrade.id
                );

            },
            5000
        );

}


/* ============================================================
   STOP CHAT REFRESH
============================================================ */

function stopChatRefresh() {

    if (
        chatRefreshTimer
    ) {

        clearInterval(
            chatRefreshTimer
        );

        chatRefreshTimer =
            null;

    }

}


/* ============================================================
   STATUS STEPS
============================================================ */

function renderStatusSteps(
    currentStatus
) {

    const currentIndex =
        STATUS_ORDER.indexOf(
            currentStatus
        );


    return STATUS_ORDER
        .map(
            (
                status,
                index
            ) => {

                let className =
                    "status-step";


                if (
                    currentIndex >= 0 &&
                    index < currentIndex
                ) {

                    className +=
                        " done";

                }


                if (
                    status ===
                    currentStatus
                ) {

                    className +=
                        " current";

                }


                return `

                    <div class="${className}">

                        ${escapeHTML(
                            statusLabel(
                                status
                            )
                        )}

                    </div>

                `;

            }
        )
        .join("");

}


/* ============================================================
   STATUS LABEL
============================================================ */

function statusLabel(
    status
) {

    return (
        STATUS_LABELS[status] ||
        status ||
        "Unknown"
    );

}


/* ============================================================
   STATUS MESSAGE
============================================================ */

function showStatus(
    message,
    type = "info"
) {

    const box =
        document.getElementById(
            "status"
        );


    if (!box) {

        return;

    }


    box.textContent =
        message;


    box.className =
        "status-message " +
        type;


    if (!message) {

        box.style.display =
            "none";

    } else {

        box.style.display =
            "block";

    }

}


/* ============================================================
   NUMBER FORMAT
============================================================ */

function formatNumber(
    value
) {

    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return "0";

    }


    return number.toLocaleString(
        undefined,
        {
            maximumFractionDigits:
                8
        }
    );

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   URL PARAMETERS
============================================================ */

function applyURLParameters() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const type =
        params.get("type");


    const asset =
        params.get("asset");


    if (
        type &&
        type.toLowerCase() ===
        "sell"
    ) {

        marketSide =
            "sell";

    } else {

        marketSide =
            "buy";

    }


    if (asset) {

        const upper =
            asset.toUpperCase();


        if (
            [
                "USDT",
                "BTC",
                "ETH"
            ].includes(
                upper
            )
        ) {

            document
                .getElementById(
                    "assetSelect"
                )
                .value =
                    upper;

        }

    }


    updateTabs();

}


/* ============================================================
   LOAD EXISTING TRADE
============================================================ */

async function loadExistingTrade() {

    if (!currentUserId) {

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("p2p_trades")
                .select("*")
                .or(
                    `buyer_id.eq.${currentUserId},seller_id.eq.${currentUserId}`
                )
                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )
                .limit(1)
                .maybeSingle();


        if (result.error) {

            console.warn(
                "Existing trade:",
                result.error.message
            );

            return;

        }


        if (result.data) {

            selectedTrade =
                result.data;


            renderMyTrade(
                result.data
            );

        }

    } catch (error) {

        console.warn(
            "Existing trade exception:",
            error
        );

    }

}


/* ============================================================
   AUTH STATE CHANGES
============================================================ */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if (session) {

            currentUserId =
                session.user.id;


            await loadExistingTrade();

        } else {

            currentUserId =
                null;


            selectedTrade =
                null;


            selectedOffer =
                null;


            selectedPaymentMethod =
                null;


            stopChatRefresh();


            const myTrade =
                document.getElementById(
                    "myTrade"
                );


            if (myTrade) {

                myTrade.innerHTML =
                    `
                    <div class="empty">

                        Please log in to view your trades.

                    </div>
                    `;

            }

        }

    }
);


/* ============================================================
   PAGE START
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        applyURLParameters();

        updateMarketTitle();

        clearTradeForm();

        await getCurrentUser();

        await refreshMarket();

        await loadExistingTrade();

    }
);

</script>
