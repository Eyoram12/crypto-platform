<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://zihxnxnviknexlqjjdot.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_A5KO4RzERX6ZOTR5vPS4kQ_GkmbxNlc";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let marketSide = "buy";

let selectedOffer = null;


/* =========================================================
   SET MARKET
========================================================= */

function setMarket(side){

  marketSide =
    side === "sell"
      ? "sell"
      : "buy";

  document
    .getElementById("buyTab")
    .classList.toggle(
      "active",
      marketSide === "buy"
    );

  document
    .getElementById("sellTab")
    .classList.toggle(
      "active",
      marketSide === "sell"
    );

  selectedOffer = null;

  document
    .getElementById("selectedTrader")
    .value =
      "No offer selected";

  document
    .getElementById("quickAmount")
    .value = "";

  updateMarketTitle();

  calculateTrade();

  refreshMarket();

}


/* =========================================================
   UPDATE TITLES
========================================================= */

function updateMarketTitle(){

  const asset =
    document
      .getElementById("assetSelect")
      .value;

  const fiat =
    document
      .getElementById("fiatSelect")
      .value;

  if(marketSide === "buy"){

    document
      .getElementById("marketTitle")
      .textContent =
        `Buy ${asset} with ${fiat}`;

    document
      .getElementById("heroTitle")
      .textContent =
        `Buy ${asset}`;

    document
      .getElementById("heroText")
      .textContent =
        `Buy ${asset} from P2P traders.`;

    document
      .getElementById("amountLabel")
      .textContent =
        `Amount (${fiat})`;

  }else{

    document
      .getElementById("marketTitle")
      .textContent =
        `Sell ${asset} for ${fiat}`;

    document
      .getElementById("heroTitle")
      .textContent =
        `Sell ${asset}`;

    document
      .getElementById("heroText")
      .textContent =
        `Sell ${asset} to P2P traders.`;

    document
      .getElementById("amountLabel")
      .textContent =
        `Amount (${asset})`;

  }

}


/* =========================================================
   LOAD OFFERS
========================================================= */

async function loadOffers(){

  const asset =
    document
      .getElementById("assetSelect")
      .value;

  const fiat =
    document
      .getElementById("fiatSelect")
      .value;

  const result =
    await supabaseClient
      .from("p2p_offers")
      .select("*")
      .eq("status","active")
      .eq("side",marketSide)
      .eq("asset",asset)
      .eq("fiat",fiat)
      .order(
        "price",
        {
          ascending:
            marketSide === "buy"
        }
      );

  if(result.error){

    console.error(
      "P2P offer error:",
      result.error
    );

    showStatus(
      "Could not load P2P offers.",
      "error"
    );

    return [];

  }

  return result.data || [];

}


/* =========================================================
   LOAD PAYMENT METHODS
========================================================= */

async function loadPaymentMethods(offers){

  if(
    !offers ||
    offers.length === 0
  ){

    return offers || [];

  }

  const traderIds = [
    ...new Set(
      offers
        .map(
          offer =>
            offer.trader_id
        )
        .filter(Boolean)
    )
  ];

  if(
    traderIds.length === 0
  ){

    return offers;

  }

  try{

    const result =
      await supabaseClient
        .from("trader_payment_methods")
        .select(`
          trader_id,
          payment_method_id,
          status,
          payment_methods (
            id,
            name,
            enabled
          )
        `)
        .in(
          "trader_id",
          traderIds
        )
        .eq(
          "status",
          "active"
        );

    if(result.error){

      console.warn(
        "Payment method warning:",
        result.error.message
      );

      return offers;

    }

    return offers.map(
      offer => {

        const methods =
          (result.data || [])
            .filter(
              row =>
                row.trader_id ===
                offer.trader_id
            )
            .map(
              row =>
                row.payment_methods
            )
            .filter(Boolean)
            .filter(
              method =>
                method.enabled !== false
            );

        return {
          ...offer,
          methods
        };

      }
    );

  }catch(error){

    console.warn(
      "Payment method exception:",
      error.message
    );

    return offers;

  }

}


/* =========================================================
   LOAD TRADER INFORMATION
========================================================= */

async function enrichOffers(offers){

  if(
    !offers ||
    offers.length === 0
  ){

    return [];

  }

  const traderIds = [
    ...new Set(
      offers
        .map(
          offer =>
            offer.trader_id
        )
        .filter(Boolean)
    )
  ];

  if(
    traderIds.length === 0
  ){

    return offers;

  }

  let profiles = [];

  let stats = [];

  try{

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .in(
          "id",
          traderIds
        );

    if(!result.error){

      profiles =
        result.data || [];

    }

  }catch(error){

    console.warn(
      "Profile warning:",
      error.message
    );

  }

  try{

    const result =
      await supabaseClient
        .from("trader_stats")
        .select("*")
        .in(
          "user_id",
          traderIds
        );

    if(!result.error){

      stats =
        result.data || [];

    }

  }catch(error){

    console.warn(
      "Trader stats warning:",
      error.message
    );

  }

  return offers.map(
    offer => {

      const profile =
        profiles.find(
          profile =>
            profile.id ===
            offer.trader_id
        );

      const traderStats =
        stats.find(
          stat =>
            stat.user_id ===
            offer.trader_id
        );

      return {
        ...offer,
        profile,
        traderStats
      };

    }
  );

}


/* =========================================================
   REFRESH MARKET
========================================================= */

async function refreshMarket(){

  updateMarketTitle();

  const container =
    document.getElementById(
      "offers"
    );

  container.innerHTML = `
    <div class="empty">
      Loading ${marketSide} offers...
    </div>
  `;

  try{

    const offers =
      await loadOffers();

    let enriched =
      await enrichOffers(
        offers
      );

    enriched =
      await loadPaymentMethods(
        enriched
      );

    renderOffers(
      enriched
    );

  }catch(error){

    console.error(
      "Refresh error:",
      error
    );

    container.innerHTML = `
      <div class="empty">
        Could not load offers.
      </div>
    `;

    showStatus(
      "Something went wrong while loading the marketplace.",
      "error"
    );

  }

}


/* =========================================================
   RENDER OFFERS
========================================================= */

function renderOffers(offers){

  const container =
    document.getElementById(
      "offers"
    );

  if(
    !offers ||
    offers.length === 0
  ){

    container.innerHTML = `
      <div class="empty">

        No active ${marketSide}
        offers are available
        for the selected asset
        and currency.

      </div>
    `;

    return;

  }

  const asset =
    document
      .getElementById("assetSelect")
      .value;

  const fiat =
    document
      .getElementById("fiatSelect")
      .value;

  container.innerHTML =
    offers.map(
      offer => {

        const profile =
          offer.profile || {};

        const stats =
          offer.traderStats || {};

        const traderName =
          profile.full_name ||
          profile.username ||
          profile.name ||
          "Trader";

        const rating =
          stats.rating ??
          stats.average_rating ??
          "New";

        const completed =
          stats.completed_trades ??
          stats.total_trades ??
          0;

        const available =
          offer.amount ??
          offer.available_amount ??
          offer.crypto_amount ??
          offer.quantity ??
          0;

        const minimum =
          offer.min_amount ??
          offer.minimum_amount ??
          0;

        const maximum =
          offer.max_amount ??
          offer.maximum_amount ??
          0;

        const methods =
          offer.methods || [];

        let paymentHTML;

        if(methods.length > 0){

          paymentHTML =
            methods
              .map(
                method =>
                  `<span>
                    ${escapeHTML(
                      method.name ||
                      "Payment"
                    )}
                  </span>`
              )
              .join("");

        }else{

          paymentHTML =
            `<span>
              Payment method
            </span>`;

        }

        const buttonText =
          marketSide === "buy"
            ? `Buy ${asset}`
            : `Sell ${asset}`;

        const buttonClass =
          marketSide === "sell"
            ? "action sell"
            : "action";

        return `

          <div class="offer">

            <div class="offer-top">

              <div>

                <div class="trader">
                  ${escapeHTML(
                    traderName
                  )}
                </div>

                <div class="verified">
                  ✓ Trader
                </div>

              </div>

              <div class="price">

                ${formatNumber(
                  offer.price
                )}

                ${fiat}

              </div>

            </div>

            <div class="info-grid">

              <div class="info">

                <small>
                  Available
                </small>

                ${formatNumber(
                  available
                )}

                ${asset}

              </div>

              <div class="info">

                <small>
                  Minimum
                </small>

                ${formatNumber(
                  minimum
                )}

                ${fiat}

              </div>

              <div class="info">

                <small>
                  Completed trades
                </small>

                ${escapeHTML(
                  String(completed)
                )}

              </div>

            </div>

            <div class="payment">

              ${paymentHTML}

            </div>

            <div style="
              font-size:13px;
              color:#667085;
              margin-bottom:12px;
            ">

              Rating:

              <strong>
                ${escapeHTML(
                  String(rating)
                )}
              </strong>

            </div>

            ${
              maximum
                ? `
                  <div style="
                    font-size:13px;
                    color:#667085;
                    margin-bottom:12px;
                  ">
                    Maximum:
                    <strong>
                      ${formatNumber(maximum)}
                      ${fiat}
                    </strong>
                  </div>
                `
                : ""
            }

            <button
              type="button"
              class="${buttonClass}"
              data-offer-id="${escapeHTML(
                String(offer.id)
              )}">

              ${buttonText}

            </button>

          </div>

        `;

      }
    ).join("");

  container
    .querySelectorAll(
      "[data-offer-id]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function(){

            selectOffer(
              this.dataset.offerId,
              offers
            );

          }
        );

      }
    );

}


/* =========================================================
   SELECT OFFER
========================================================= */

function selectOffer(
  offerId,
  offers
){

  const offer =
    offers.find(
      item =>
        String(item.id) ===
        String(offerId)
    );

  if(!offer){

    showStatus(
      "Offer could not be found.",
      "error"
    );

    return;

  }

  selectedOffer =
    offer;

  const profile =
    offer.profile || {};

  const traderName =
    profile.full_name ||
    profile.username ||
    profile.name ||
    "Trader";

  document
    .getElementById(
      "selectedTrader"
    )
    .value =
      traderName;

  calculateTrade();

  document
    .querySelector(".quick")
    .scrollIntoView({
      behavior:"smooth"
    });

  showStatus(
    "Offer selected. Enter your amount.",
    "success"
  );

}


/* =========================================================
   CALCULATE TRADE
========================================================= */

function calculateTrade(){

  const amount =
    parseFloat(
      document
        .getElementById(
          "quickAmount"
        )
        .value
    ) || 0;

  const rate =
    selectedOffer
      ? Number(
          selectedOffer.price
        )
      : 0;

  const asset =
    document
      .getElementById(
        "assetSelect"
      )
      .value;

  const fiat =
    document
      .getElementById(
        "fiatSelect"
      )
      .value;

  const rateElement =
    document
      .getElementById(
        "calcRate"
      );

  const feeElement =
    document
      .getElementById(
        "calcFee"
      );

  const receiveElement =
    document
      .getElementById(
        "calcReceive"
      );

  if(
    !selectedOffer ||
    !rate ||
    amount <= 0
  ){

    rateElement.textContent =
      "-";

    feeElement.textContent =
      "-";

    receiveElement.textContent =
      "-";

    return;

  }

  const feeRate =
    0.005;

  if(
    marketSide === "buy"
  ){

    const crypto =
      amount / rate;

    const fee =
      crypto * feeRate;

    const receive =
      crypto - fee;

    rateElement.textContent =
      `${formatNumber(rate)} ${fiat}`;

    feeElement.textContent =
      `${fee.toFixed(6)} ${asset}`;

    receiveElement.textContent =
      `${receive.toFixed(6)} ${asset}`;

    return;

  }

  const gross =
    amount * rate;

  const fee =
    gross * feeRate;

  const receive =
    gross - fee;

  rateElement.textContent =
    `${formatNumber(rate)} ${fiat}`;

  feeElement.textContent =
    `${fee.toFixed(2)} ${fiat}`;

  receiveElement.textContent =
    `${receive.toFixed(2)} ${fiat}`;

}


/* =========================================================
   CREATE P2P TRADE
========================================================= */

async function createTrade(){

  const button =
    document.getElementById(
      "createTradeBtn"
    );

  if(button){

    button.disabled = true;

  }

  try{

    if(!selectedOffer){

      showStatus(
        "Please select a P2P offer first.",
        "error"
      );

      return;

    }

    const amount =
      parseFloat(
        document
          .getElementById(
            "quickAmount"
          )
          .value
      ) || 0;

    if(amount <= 0){

      showStatus(
        "Please enter a valid amount.",
        "error"
      );

      return;

    }

    const asset =
      document
        .getElementById(
          "assetSelect"
        )
        .value;

    const fiat =
      document
        .getElementById(
          "fiatSelect"
        )
        .value;

    const price =
      Number(
        selectedOffer.price
      );

    if(!price || price <= 0){

      showStatus(
        "This offer has an invalid price.",
        "error"
      );

      return;

    }

    const minimum =
      Number(
        selectedOffer.min_amount ??
        selectedOffer.minimum_amount ??
        0
      );

    const maximum =
      Number(
        selectedOffer.max_amount ??
        selectedOffer.maximum_amount ??
        0
      );

    /*
       For BUY:
       amount is fiat.

       For SELL:
       amount is crypto.
    */

    let cryptoAmount = 0;

    let fiatAmount = 0;

    let tradingFee = 0;

    if(marketSide === "buy"){

      fiatAmount =
        amount;

      cryptoAmount =
        amount / price;

      tradingFee =
        cryptoAmount * 0.005;

    }else{

      cryptoAmount =
        amount;

      fiatAmount =
        amount * price;

      tradingFee =
        fiatAmount * 0.005;

    }

    /*
       Validate offer limits.

       Existing P2P offers use minimum and maximum
       values. We validate against the entered
       amount in the offer's displayed currency.
    */

    if(
      minimum > 0 &&
      fiatAmount < minimum &&
      marketSide === "buy"
    ){

      showStatus(
        `Amount is below the minimum of ${formatNumber(minimum)} ${fiat}.`,
        "error"
      );

      return;

    }

    if(
      maximum > 0 &&
      fiatAmount > maximum &&
      marketSide === "buy"
    ){

      showStatus(
        `Amount is above the maximum of ${formatNumber(maximum)} ${fiat}.`,
        "error"
      );

      return;

    }

    const sessionResult =
      await supabaseClient
        .auth
        .getSession();

    if(
      sessionResult.error
    ){

      console.error(
        "Session error:",
        sessionResult.error
      );

      showStatus(
        "Could not check your login session.",
        "error"
      );

      return;

    }

    const session =
      sessionResult.data.session;

    if(!session){

      showStatus(
        "Please log in to CryptoVault before creating a trade.",
        "error"
      );

      return;

    }

    const currentUser =
      session.user;

    const buyerId =
      marketSide === "buy"
        ? currentUser.id
        : selectedOffer.trader_id;

    const sellerId =
      marketSide === "sell"
        ? currentUser.id
        : selectedOffer.trader_id;

    if(!selectedOffer.trader_id){

      showStatus(
        "This offer has no trader ID.",
        "error"
      );

      return;

    }

    /*
       The payment method is intentionally left null
       until a specific payment method is selected.
    */

    const tradeData = {

      offer_id:
        selectedOffer.id,

      buyer_id:
        buyerId,

      seller_id:
        sellerId,

      asset:
        asset,

      crypto_amount:
        cryptoAmount,

      fiat_amount:
        fiatAmount,

      price:
        price,

      trading_fee:
        tradingFee,

      payment_method:
        null,

      status:
        "pending",

      payment_reference:
        null,

      expires:
        new Date(
          Date.now() +
          30 * 60 * 1000
        ).toISOString()

    };

    console.log(
      "Creating P2P trade:",
      tradeData
    );

    const result =
      await supabaseClient
        .from("p2p_trades")
        .insert(
          tradeData
        )
        .select()
        .single();

    if(result.error){

      console.error(
        "P2P trade creation error:",
        result.error
      );

      showStatus(
        "Trade could not be created: " +
        result.error.message,
        "error"
      );

      return;

    }

    showStatus(
      "P2P trade created successfully.",
      "success"
    );

    console.log(
      "Created P2P trade:",
      result.data
    );

  }catch(error){

    console.error(
      "Create trade exception:",
      error
    );

    showStatus(
      "Something went wrong while creating the trade.",
      "error"
    );

  }finally{

    if(button){

      button.disabled = false;

    }

  }

}


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(
  message,
  type
){

  const box =
    document.getElementById(
      "status"
    );

  box.textContent =
    message;

  box.className =
    "status " +
    (
      type === "success"
        ? "success"
        : "error"
    );

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

  const number =
    Number(value);

  if(
    Number.isNaN(number)
  ){

    return "0";

  }

  return number.toLocaleString(
    undefined,
    {
      maximumFractionDigits:8
    }
  );

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   READ URL PARAMETERS
========================================================= */

function applyURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const type =
    params.get("type");

  const asset =
    params.get("asset");

  if(
    type &&
    type.toLowerCase() === "sell"
  ){

    marketSide =
      "sell";

  }else{

    marketSide =
      "buy";

  }

  if(asset){

    const upper =
      asset.toUpperCase();

    if(
      [
        "USDT",
        "BTC",
        "ETH"
      ].includes(upper)
    ){

      document
        .getElementById(
          "assetSelect"
        )
        .value =
          upper;

    }

  }

  document
    .getElementById(
      "buyTab"
    )
    .classList.toggle(
      "active",
      marketSide === "buy"
    );

  document
    .getElementById(
      "sellTab"
    )
    .classList.toggle(
      "active",
      marketSide === "sell"
    );

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    applyURL();

    updateMarketTitle();

    await refreshMarket();

  }
);

</script>
