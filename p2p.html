<body>

<header>
  <div class="logo">
    Crypto<span>Vault</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="p2p.html">P2P</a>
  </nav>
</header>


<div class="container">

  <section class="hero">
    <h1 id="heroTitle">P2P Marketplace</h1>
    <p id="heroText">
      Buy and sell cryptocurrency directly with verified traders.
    </p>
  </section>


  <section class="market-box">

    <div class="tabs">

      <button
        id="buyTab"
        class="market-tab active"
        onclick="setMarket('buy')">
        Buy
      </button>

      <button
        id="sellTab"
        class="market-tab"
        onclick="setMarket('sell')">
        Sell
      </button>

    </div>


    <div class="filters">

      <div>
        <label>Asset</label>

        <select
          id="assetSelect"
          onchange="refreshMarket()">

          <option value="USDT">USDT</option>
          <option value="BTC">BTC</option>
          <option value="ETH">ETH</option>

        </select>
      </div>


      <div>
        <label>Fiat Currency</label>

        <select
          id="fiatSelect"
          onchange="refreshMarket()">

          <option value="ETB">ETB</option>
          <option value="USD">USD</option>

        </select>
      </div>

    </div>

  </section>


  <section class="market-box">

    <div
      id="marketTitle"
      class="market-title">
      Buy USDT with ETB
    </div>

    <div
      id="offers"
      class="offers">

      <div class="empty">

      </div>

  <section class="quick">

      <div class="calc-row">

</div>


<footer>
  CryptoVault P2P Marketplace

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://zihxnxnviknexlqjjdot.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_A5KO4RzERX6ZOTR5vPS4kQ_GkmbxNlc";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let marketSide = "buy";

let selectedOffer = null;


/* =========================================================
   SET BUY / SELL
========================================================= */

function setMarket(side){

  marketSide =
    side === "sell"
      ? "sell"
      : "buy";

  document
    .getElementById("buyTab")
    .classList.toggle(
      "active",
      marketSide === "buy"
    );

  document
    .getElementById("sellTab")
    .classList.toggle(
      "active",
      marketSide === "sell"
    );

  selectedOffer = null;

  document
    .getElementById("selectedTrader")
    .value =
      "No offer selected";

  document
    .getElementById("quickAmount")
    .value = "";

  updateMarketTitle();

  calculateTrade();

  refreshMarket();
}


/* =========================================================
   TITLE
========================================================= */

function updateMarketTitle(){

  const asset =
    document.getElementById(
      "assetSelect"
    ).value;

  const fiat =
    document.getElementById(
      "fiatSelect"
    ).value;

  document
    .getElementById("marketTitle")
    .textContent =
      marketSide === "buy"
        ? `Buy ${asset} with ${fiat}`
        : `Sell ${asset} for ${fiat}`;

  document
    .getElementById("heroTitle")
    .textContent =
      marketSide === "buy"
        ? `Buy ${asset}`
        : `Sell ${asset}`;

  document
    .getElementById("heroText")
    .textContent =
      marketSide === "buy"
        ? `Buy ${asset} from P2P traders.`
        : `Sell ${asset} to P2P traders.`;

  document
    .getElementById("amountLabel")
    .textContent =
      marketSide === "buy"
        ? `Amount (${fiat})`
        : `Amount (${asset})`;
}


/* =========================================================
   LOAD OFFERS
========================================================= */

async function loadOffers(){

  const asset =
    document.getElementById(
      "assetSelect"
    ).value;

  const fiat =
    document.getElementById(
      "fiatSelect"
    ).value;


  const { data, error } =
    await supabaseClient

      .from("p2p_offers")

      .select("*")

      .eq(
        "status",
        "active"
      )

      .eq(
        "side",
        marketSide
      )

      .eq(
        "asset",
        asset
      )

      .eq(
        "fiat",
        fiat
      )

      .order(
        "price",
        {
          ascending:
            marketSide === "buy"
        }
      );


  if(error){

    console.error(
      "Offer error:",
      error
    );

    showStatus(
      "Could not load P2P offers.",
      "error"
    );

    return [];
  }


  return data || [];
}


/* =========================================================
   LOAD TRADER PAYMENT METHODS
========================================================= */

async function loadPaymentMethods(
  offers
){

  if(
    !offers ||
    !offers.length
  ){

    return offers || [];
  }


  const traderIds = [
    ...new Set(
      offers
        .map(
          offer =>
            offer.trader_id
        )
        .filter(Boolean)
    )
  ];


  if(!traderIds.length){

    return offers;
  }


  try{

    const { data, error } =
      await supabaseClient

        .from(
          "trader_payment_methods"
        )

        .select(`
          trader_id,
          payment_method_id,
          status,
          payment_methods (
            id,
            name,
            code,
            enabled
          )
        `)

        .in(
          "trader_id",
          traderIds
        )

        .eq(
          "status",
          "active"
        );


    if(error){

      console.warn(
        "Payment method error:",
        error.message
      );

      return offers;
    }


    return offers.map(
      offer => {

        const methods =
          (data || [])

            .filter(
              row =>
                row.trader_id ===
                offer.trader_id
            )

            .map(
              row =>
                row.payment_methods
            )

            .filter(Boolean)

            .filter(
              method =>
                method.enabled !== false
            );


        return {
          ...offer,
          methods
        };

      }
    );

  }catch(error){

    console.warn(
      error.message
    );

    return offers;
  }
}


/* =========================================================
   LOAD TRADER PROFILE
========================================================= */

async function enrichOffers(
  offers
){

  if(
    !offers ||
    !offers.length
  ){

    return [];
  }


  const traderIds = [
    ...new Set(
      offers
        .map(
          offer =>
            offer.trader_id
        )
        .filter(Boolean)
    )
  ];


  if(!traderIds.length){

    return offers;
  }


  let profiles = [];
  let stats = [];


  try{

    const profileResult =
      await supabaseClient

        .from("profiles")

        .select("*")

        .in(
          "id",
          traderIds
        );


    profiles =
      profileResult.data || [];


  }catch(error){

    console.warn(
      "Profile error:",
      error.message
    );

  }


  try{

    const statsResult =
      await supabaseClient

        .from("trader_stats")

        .select("*")

        .in(
          "user_id",
          traderIds
        );


    stats =
      statsResult.data || [];


  }catch(error){

    console.warn(
      "Trader stats error:",
      error.message
    );

  }


  return offers.map(
    offer => {

      const profile =
        profiles.find(
          p =>
            p.id ===
            offer.trader_id
        );


      const traderStats =
        stats.find(
          s =>
            s.user_id ===
            offer.trader_id
        );


      return {
        ...offer,
        profile,
        traderStats
      };

    }
  );
}


/* =========================================================
   REFRESH MARKET
========================================================= */

async function refreshMarket(){

  updateMarketTitle();


  const offers =
    await loadOffers();


  let enriched =
    await enrichOffers(
      offers
    );


  enriched =
    await loadPaymentMethods(
      enriched
    );


  renderOffers(
    enriched
  );
}
