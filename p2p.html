<script>

let marketSide = "buy";
let selectedOffer = null;
let selectedTraderData = null;

function setMarket(side) {
  marketSide = side === "sell" ? "sell" : "buy";

  const buyTab = document.getElementById("buyTab");
  const sellTab = document.getElementById("sellTab");

  if (buyTab) {
    buyTab.classList.toggle("active", marketSide === "buy");
  }

  if (sellTab) {
    sellTab.classList.toggle("active", marketSide === "sell");
  }

  selectedOffer = null;
  selectedTraderData = null;

  updateMarketTitle();
  calculateTrade();
  refreshMarket();
}

/* the rest of your JavaScript here */

</script>
