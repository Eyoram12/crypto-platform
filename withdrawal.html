<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Withdrawal | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #151c32;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #4f8cff;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: #151c32;
            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #aab3c5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #35405f;
            border-radius: 8px;
            background: #0f1629;
            color: white;
            font-size: 15px;
        }

        .balance {
            background: #202a45;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .balance span {
            display: block;
            color: #aab3c5;
            margin-bottom: 6px;
        }

        .balance strong {
            font-size: 22px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3677e8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6ea0ff;
            text-decoration: none;
        }

        .warning {
            margin-top: 20px;
            padding: 14px;
            background: #202a45;
            border-radius: 8px;
            color: #ffcc66;
            font-size: 13px;
            text-align: center;
        }

        .demo {
            text-align: center;
            margin-top: 20px;
            color: #8f9ab0;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CryptoVault</div>
        <a href="dashboard.html">Dashboard</a>
    </header>

    <div class="container">

        <div class="card">

            <h1>Withdraw Crypto</h1>

            <p class="description">
                Enter the wallet address and amount for your withdrawal request.
            </p>

            <div class="balance">
                <span>Available Balance</span>
                <strong>0.050 BTC</strong>
            </div>

            <form action="dashboard.html">

                <label for="crypto">Cryptocurrency</label>

                <select id="crypto" name="crypto" required>
                    <option value="">Select cryptocurrency</option>
                    <option value="BTC">Bitcoin (BTC)</option>
                    <option value="ETH">Ethereum (ETH)</option>
                    <option value="USDT">Tether (USDT)</option>
                </select>

                <label for="address">Wallet Address</label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter wallet address"
                    required
                >

                <label for="amount">Withdrawal Amount</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="any"
                    required
                >

                <label for="network">Network</label>

                <select id="network" name="network" required>
                    <option value="">Select network</option>
                    <option value="bitcoin">Bitcoin Network</option>
                    <option value="ethereum">Ethereum Network</option>
                    <option value="tron">TRON Network</option>
                </select>

                <button type="submit">
                    Submit Withdrawal Request
                </button>

            </form>

            <div class="warning">
                ⚠️ Demo platform only. Do not enter a real wallet address
                or send real cryptocurrency.
            </div>

            <a class="back" href="dashboard.html">
                ← Back to Dashboard
            </a>

            <p class="demo">
                No real cryptocurrency or money is processed.
            </p>

        </div>

    </div>

</body>

</html>
