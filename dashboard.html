<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #11182d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #4f7cff;
            padding: 9px 16px;
            border-radius: 7px;
        }

        .container {
            width: 86%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #aeb8d0;
        }

        .balance {
            background: #151e38;
            padding: 30px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .balance p {
            color: #aeb8d0;
            margin-bottom: 10px;
        }

        .balance h2 {
            font-size: 36px;
        }

        .coins {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .coin {
            background: #151e38;
            padding: 25px;
            border-radius: 14px;
        }

        .coin h3 {
            margin-bottom: 10px;
        }

        .coin p {
            color: #aeb8d0;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .action {
            text-align: center;
            padding: 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            background: #4f7cff;
            color: white;
        }

        .transactions {
            background: #151e38;
            padding: 25px;
            border-radius: 14px;
        }

        .transactions h2 {
            margin-bottom: 20px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #2b3550;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .deposit-text {
            color: #65d98a;
        }

        .withdraw-text {
            color: #ff7474;
        }

        @media (max-width: 700px) {
            .coins,
            .actions {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            header {
                padding: 18px 4%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CryptoVault</div>
    <a href="index.html" class="logout">Logout</a>
</header>

<div class="container">

    <div class="welcome">
        <h1>Welcome to Your Dashboard</h1>
        <p>Manage your digital assets and transactions.</p>
    </div>

    <div class="balance">
        <p>Total Balance</p>
        <h2>$10,000.00</h2>
    </div>

    <div class="coins">

        <div class="coin">
            <h3>Bitcoin</h3>
            <p>BTC Balance</p>
            <h2>0.050 BTC</h2>
        </div>

        <div class="coin">
            <h3>Ethereum</h3>
            <p>ETH Balance</p>
            <h2>1.250 ETH</h2>
        </div>

    </div>

    <div class="actions">
        <a href="deposit.html" class="action">Deposit</a>
        <a href="withdrawal.html" class="action">Withdrawal</a>
    </div>

    <div class="transactions">

        <h2>Recent Transactions</h2>

        <div class="transaction">
            <span>Bitcoin Deposit</span>
            <span class="deposit-text">+ $500</span>
        </div>

        <div class="transaction">
            <span>Ethereum Deposit</span>
            <span class="deposit-text">+ $300</span>
        </div>

        <div class="transaction">
            <span>Withdrawal</span>
            <span class="withdraw-text">- $100</span>
        </div>

    </div>

</div>

</body>
</html>
