
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | CryptoVault</title>

    <style>
        :root {
            --bg: #07111f;
            --bg-soft: #0b1728;
            --card: #101d30;
            --card-hover: #14243a;
            --text: #f5f7fb;
            --muted: #9aa8ba;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #20324a;
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 17, 31, 0.96);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1250px;
            min-height: 70px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a {
            color: var(--muted);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
            background: var(--card);
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            margin-left: 5px;
        }

        .theme-btn:hover {
            transform: scale(1.08);
        }

        .menu-btn {
            display: none;
            background: transparent;
            border: 0;
            color: var(--text);
            font-size: 28px;
            cursor: pointer;
        }

        /* MAIN */

        main {
            max-width: 1250px;
            margin: auto;
            padding: 42px 20px 70px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 11px;
            border-radius: 20px;
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .welcome h1 {
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 7px;
        }

        .welcome p {
            color: var(--muted);
        }

        /* CONTROLS */

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 18px;
        }

        .control-btn {
            padding: 9px 14px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 9px;
            cursor: pointer;
            transition: 0.3s;
        }

        .control-btn:hover {
            background: var(--card-hover);
        }

        /* BALANCE */

        .balance-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 90% 20%, rgba(59, 130, 246, 0.22), transparent 35%),
                linear-gradient(135deg, #172b49, #0e1d32);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .balance-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            right: -60px;
            bottom: -90px;
        }

        .balance-label {
            color: var(--muted);
            font-size: 14px;
        }

        .balance-value {
            font-size: 43px;
            font-weight: 800;
            margin: 7px 0;
            letter-spacing: -1px;
        }

        .balance-change {
            color: var(--success);
            font-size: 14px;
        }

        .balance-demo {
            margin-top: 16px;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
            font-size: 11px;
        }

        /* STATS */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
        }

        /* GENERAL CARD */

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .card-header h2 {
            font-size: 20px;
        }

        .card-header span {
            color: var(--muted);
            font-size: 12px;
        }

        /* DASHBOARD GRID */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.35fr 0.9fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* CHART */

        .chart {
            height: 220px;
            display: flex;
            align-items: end;
            gap: 10px;
            padding-top: 20px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary-dark), #60a5fa);
            border-radius: 6px 6px 0 0;
            min-height: 20px;
            transition: 0.3s;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        .chart-labels {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .chart-labels span {
            flex: 1;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        /* ASSETS */

        .asset {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .asset:last-child {
            border-bottom: 0;
        }

        .asset-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .asset-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-soft);
            font-size: 17px;
            border: 1px solid var(--border);
        }

        .asset-name strong {
            display: block;
        }

        .asset-name span {
            color: var(--muted);
            font-size: 12px;
        }

        .asset-value {
            text-align: right;
        }

        .asset-value strong {
            display: block;
        }

        .asset-value span {
            color: var(--muted);
            font-size: 12px;
        }

        /* MARKET */

        .market-section {
            margin-bottom: 25px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .market-card {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 16px;
            transition: 0.3s;
        }

        .market-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .market-name {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 7px;
        }

        .market-price {
            font-size: 17px;
            font-weight: 800;
        }

        .market-change {
            font-size: 12px;
            margin-top: 3px;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--danger);
        }

        /* P2P FEATURE */

        .p2p-banner {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 95% 10%, rgba(139, 92, 246, 0.25), transparent 35%),
                linear-gradient(135deg, #151d38, #10192b);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .p2p-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .p2p-label {
            color: #a78bfa;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .p2p-banner h2 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .p2p-banner p {
            color: var(--muted);
            font-size: 13px;
            max-width: 650px;
        }

        .p2p-button {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--purple);
            color: white;
            font-weight: 700;
            font-size: 13px;
            transition: 0.3s;
        }

        .p2p-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .p2p-features {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .p2p-tag {
            padding: 6px 9px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.05);
            color: #c4b5fd;
            font-size: 11px;
        }

        /* QUICK ACTIONS */

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .quick-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 21px;
            transition: 0.3s;
        }

        .quick-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
        }

        .quick-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            font-size: 20px;
            margin-bottom: 13px;
        }

        .quick-card h3 {
            margin-bottom: 7px;
            font-size: 16px;
        }

        .quick-card p {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 14px;
        }

        .quick-link {
            color: #60a5fa;
            font-weight: 700;
            font-size: 13px;
        }

        /* SECURITY */

        .security-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .security-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .security-text {
            color: var(--muted);
            font-size: 13px;
        }

        .security-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .security-item {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-soft);
            font-size: 12px;
        }

        .security-item strong {
            display: block;
            margin-bottom: 3px;
        }

        .security-item span {
            color: var(--success);
        }

        /* TRANSACTIONS */

        .transaction-card {
            margin-bottom: 25px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .transaction:last-child {
            border-bottom: 0;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .transaction-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .transaction-left strong {
            display: block;
        }

        .transaction-left span {
            color: var(--muted);
            font-size: 12px;
        }

        .transaction-right {
            text-align: right;
        }

        .transaction-right strong {
            display: block;
        }

        .transaction-right span {
            font-size: 11px;
            color: var(--success);
        }

        /* NOTICE */

        .notice {
            padding: 18px;
            border-radius: 12px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .notice strong {
            color: var(--text);
        }

        /* FOOTER */

        footer {
            border-top: 1px solid var(--border);
            padding: 30px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        /* LIGHT MODE */

        body.light-mode {
            --bg: #f4f7fb;
            --bg-soft: #eaf0f7;
            --card: #ffffff;
            --card-hover: #f1f5f9;
            --text: #172033;
            --muted: #64748b;
            --border: #d7dee8;
        }

        body.light-mode header {
            background: rgba(255, 255, 255, 0.95);
        }

        body.light-mode .balance-card {
            background: linear-gradient(135deg, #e4efff, #ffffff);
        }

        body.light-mode .p2p-banner {
            background: linear-gradient(135deg, #f0ebff, #ffffff);
        }

        body.light-mode .theme-btn,
        body.light-mode .control-btn {
            background: #ffffff;
        }

        /* RESPONSIVE */

        @media (max-width: 1050px) {

            .nav-links {
                gap: 2px;
            }

            .nav-links a {
                padding: 8px 7px;
                font-size: 12px;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }

            .market-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {

            .menu-btn {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                display: none;
                flex-direction: column;
                align-items: stretch;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                padding: 15px 20px 20px;
            }

            .nav-links.show {
                display: flex;
            }

            .nav-links a,
            .theme-btn {
                width: 100%;
                text-align: center;
                border-radius: 8px;
            }

            .theme-btn {
                height: 42px;
                border-radius: 8px;
                margin: 0;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .market-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .p2p-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .p2p-button {
                width: 100%;
            }

            .security-items {
                grid-template-columns: 1fr;
            }

            main {
                padding: 30px 15px 55px;
            }

            .welcome h1 {
                font-size: 29px;
            }

            .balance-value {
                font-size: 34px;
            }
        }

        @media (max-width: 500px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .market-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                justify-content: stretch;
            }

            .control-btn {
                flex: 1;
            }

            .card,
            .security-card,
            .balance-card,
            .p2p-banner {
                padding: 20px;
            }

            .chart {
                height: 180px;
            }

            .transaction-left strong {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            Crypto<span>Vault</span>
