<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CryptoVault | Create Account</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #172033;
}

.container {
    width: 92%;
    max-width: 460px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
    color: #111827;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 25px;
    font-size: 14px;
}

.input-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 70px;
}

.show {
    position: absolute;
    right: 9px;
    top: 8px;
    border: none;
    background: transparent;
    color: #2563eb;
    font-weight: bold;
    cursor: pointer;
    padding: 7px;
}

.terms {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12px;
    color: #667085;
    margin: 18px 0;
}

.terms input {
    width: auto;
    margin-top: 2px;
}

.terms a {
    color: #2563eb;
    text-decoration: none;
}

.create {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.create:hover {
    opacity: .9;
}

.message {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #ecfdf3;
    color: #166534;
    text-align: center;
    font-size: 13px;
}

.login {
    text-align: center;
    margin-top: 22px;
    color: #667085;
    font-size: 14px;
}

.login a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.security {
    margin-top: 20px;
    padding: 14px;
    background: #f8fafc;
    border-radius: 9px;
    text-align: center;
    color: #667085;
    font-size: 12px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #667085;
    text-decoration: none;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🔐 CryptoVault
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <div class="subtitle">
            Create your CryptoVault account
        </div>


        <form onsubmit="createAccount(event)">

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="#" onclick="showTerms(event)">
                        Terms of Service
                    </a>
                    and
                    <a href="#" onclick="showPrivacy(event)">
                        Privacy Policy
                    </a>.
                </span>

            </label>


            <button
                type="submit"
                class="create"
            >
                Create Account
            </button>


            <div
                id="message"
                class="message"
            >
                Account created successfully. Opening your account...
            </div>

        </form>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Sign In
            </a>

        </div>


        <div class="security">

            🔒 Account security is important to us.

        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>

</div>


<script>

function togglePassword(id, button) {

    const input =
        document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

    } else {

        input.type = "password";
        button.textContent = "Show";

    }

}


function createAccount(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;

    }

    document.getElementById("message").style.display =
        "block";

    setTimeout(function() {

        window.location.href = "dashboard.html";

    }, 1200);

}


function showTerms(event) {

    event.preventDefault();

    alert(
        "Terms of Service: This interface demonstrates account registration functionality."
    );

}


function showPrivacy(event) {

    event.preventDefault();

    alert(
        "Privacy Policy: This website interface does not collect or store real financial credentials."
    );

}

</script>

</body>
</html>
