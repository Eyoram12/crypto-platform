<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #151e38;
            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aeb8d0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #35405f;
            border-radius: 7px;
            background: #0b1020;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #4f7cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #aeb8d0;
        }

        .login a {
            color: #6f94ff;
            text-decoration: none;
        }

        .home {
            text-align: center;
            margin-top: 20px;
        }

        .home a {
            color: #aeb8d0;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <p class="subtitle">
        Join CryptoVault
    </p>

    <form>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required>

        <button type="submit">Create Account</button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="home">
        <a href="index.html">Back to Home</a>
    </div>

</div>

</body>
</html>
