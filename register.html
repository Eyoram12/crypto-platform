<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #151c32;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab3c5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #35405f;
            border-radius: 8px;
            background: #0f1629;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f8cff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #3677e8;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            line-height: 2;
        }

        .links a {
            color: #6ea0ff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #202a45;
            border-radius: 8px;
            color: #aab3c5;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">CryptoVault</div>

        <p class="subtitle">Create your account</p>

        <form action="login.html">

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <div class="links">
            Already have an account?
            <a href="login.html">Login</a>
            <br>
            <a href="index.html">← Back to Home</a>
        </div>

        <div class="notice">
            Demo platform only. No real cryptocurrency or money is processed.
        </div>

    </div>

</body>

</html>
