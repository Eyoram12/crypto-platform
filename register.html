<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #07111f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #3b82f6;
        }

        .card {
            background: #0d1c2e;
            border: 1px solid #203952;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #91a5ba;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #29445f;
            background: #081525;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 75px;
        }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #60a5fa;
            cursor: pointer;
            font-size: 13px;
        }

        .strength {
            height: 5px;
            background: #203952;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: 0.3s;
        }

        .terms {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            margin: 20px 0;
            color: #91a5ba;
            font-size: 13px;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a {
            color: #60a5fa;
        }

        button.submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button.submit:hover {
            background: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #91a5ba;
            font-size: 14px;
        }

        .login a {
            color: #60a5fa;
            font-weight: 700;
        }

        .demo {
            margin-top: 22px;
            padding: 13px;
            border: 1px solid #5a4718;
            background: #211b0b;
            border-radius: 9px;
            color: #fbbf24;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #91a5ba;
            font-size: 13px;
        }

        .home:hover {
            color: white;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Crypto<span>Vault</span>
    </div>

    <div class="card">

        <h1>Create your account</h1>

        <p class="subtitle">
            Create a demo account to explore the CryptoVault platform.
        </p>

        <form action="login.html" method="get" onsubmit="return validateForm()">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        oninput="checkPassword()"
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>
                </div>

                <div class="strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>

                <span>
                    I understand that this is a demonstration website and
                    does not process real cryptocurrency or financial
                    transactions.
                </span>
            </label>

            <button type="submit" class="submit">
                Create Demo Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Log In</a>
        </div>

        <div class="demo">
            DEMO ONLY: No real account, cryptocurrency, payment,
            investment, or withdrawal is created or processed.
        </div>

        <a href="index.html" class="home">
            ← Back to Home
        </a>

    </div>

</div>

<script>

    function togglePassword(id, button) {

        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }


    function checkPassword() {

        const password =
            document.getElementById("password").value;

        const bar =
            document.getElementById("strengthBar");

        let strength = 0;

        if (password.length >= 6) {
            strength++;
        }

        if (/[A-Z]/.test(password)) {
            strength++;
        }

        if (/[0-9]/.test(password)) {
            strength++;
        }

        if (/[^A-Za-z0-9]/.test(password)) {
            strength++;
        }

        if (strength === 0) {
            bar.style.width = "0%";
        } else if (strength === 1) {
            bar.style.width = "25%";
        } else if (strength === 2) {
            bar.style.width = "50%";
        } else if (strength === 3) {
            bar.style.width = "75%";
        } else {
            bar.style.width = "100%";
        }
    }


    function validateForm() {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return false;
        }

        return true;
    }

</script>

</body>
</html>
